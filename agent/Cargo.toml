[package]
name = "openxdr-agent"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["ebpf"]
default-members = ["."]

# 受管主机上的托盘（只显示防护状态），与 agent 共用状态协议（src/status_proto.rs）
[[bin]]
name = "openxdr-tray"
path = "src/tray/main.rs"

[features]
# eBPF 采集需要 nightly 工具链与 bpf-linker，按需开启；
# 关闭时 Linux 侧走 netlink proc connector（失败再退轮询），构建不依赖任何外部二进制
default = []
ebpf = ["dep:aya", "dep:bytes", "dep:aya-build"]
# 执行拦截独立于采集；CO-RE 程序用支持 BPF target 的 clang 构建。
execblock = ["dep:aya"]

[dependencies]
# 本地事件缓存的批次压缩。只用纯 Rust 后端（miniz_oxide）：CI 要交叉编译到
# x86_64-pc-windows-gnu，不能引入需要 C 工具链或系统 zlib 的后端
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
gethostname = "1.1.0"
if-addrs = "0.15.0"
libc = "0.2.189"
prost = "0.14.4"
# 指令签名信封验签（Ed25519）；rustls 已经带着它，不新增依赖树
ring = "0.17"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"], optional = true }
bytes = { version = "1", optional = true }
# 托盘（openxdr-tray）：StatusNotifierItem 与桌面通知都走 D-Bus，纯 Rust，不依赖 GTK
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
ferrisetw = "1"
windows-sys = { version = "0.60", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
 "Win32_NetworkManagement_IpHelper",
 "Win32_NetworkManagement_WindowsFilteringPlatform",
 "Win32_System_Rpc",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    # 托盘（openxdr-tray）
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tonic-prost-build = "0.14.6"
aya-build = { version = "0.1", optional = true }
protoc-bin-vendored = "3.2.0"
