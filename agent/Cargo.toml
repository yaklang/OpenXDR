[package]
name = "openxdr-agent"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["ebpf"]
default-members = ["."]

[features]
# eBPF 采集需要 nightly 工具链与 bpf-linker，按需开启；
# 关闭时 Linux 侧走轮询采集，构建不依赖任何外部二进制
default = []
ebpf = ["dep:aya", "dep:bytes", "dep:aya-build"]

[dependencies]
gethostname = "1.1.0"
if-addrs = "0.15.0"
libc = "0.2.189"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"], optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ferrisetw = "1"
windows-sys = { version = "0.60", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
tonic-prost-build = "0.14.6"
aya-build = { version = "0.1", optional = true }
protoc-bin-vendored = "3.2.0"
