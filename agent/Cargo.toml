[package]
name = "openxdr-agent"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["ebpf"]
default-members = ["."]

[dependencies]
gethostname = "1.1.0"
if-addrs = "0.15.0"
prost = "0.14.4"
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
bytes = "1"

[target.'cfg(target_os = "windows")'.dependencies]
ferrisetw = "1"

[build-dependencies]
tonic-prost-build = "0.14.6"
aya-build = "0.1"
