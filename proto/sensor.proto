// OpenXDR sensor <-> server 通信契约。
// 流量探针专属通道：注册与升级、抓包状态、会话记录批量上报。会话字段与端点事件差异大，独立于 agent.proto。
// 消息名带 Sensor 前缀：Go 侧两份契约生成在同一个包里，不能与 agent.proto 重名。
syntax = "proto3";

package openxdr.sensor.v1;

option go_package = "openxdr/server/pb";

service SensorService {
  // 启动与重连时注册：登记探针所在主机，取回自动升级指令
  rpc Register(SensorRegisterRequest) returns (SensorRegisterResponse);
  // 抓包状态，独立于会话上报，与 agent 的采集状态同一口径
  rpc ReportHealth(SensorHealthRequest) returns (SensorHealthAck);
  // 客户端流式上报会话记录，一条长连接批量推
  rpc ReportFlows(stream FlowBatch) returns (FlowAck);
  // 下载 server 分发的 sensor 安装包，分块流式返回。走已认证的同一条通道，不另开下载地址
  rpc DownloadSensor(SensorDownloadRequest) returns (stream SensorChunk);
}

message SensorRegisterRequest {
  string hostname = 1;        // 探针所在主机名；绑定证书（CN sensor:<主机名>）时必须一致
  repeated string ip_addrs = 2;
  string version = 3;
  string arch = 4;            // Rust std::env::consts::ARCH，如 x86_64
  string binary_sha256 = 5;   // 当前运行的二进制哈希，空表示不支持自动升级
}

message SensorRegisterResponse {
  // 分发目录里的版本与探针当前二进制不同时给出，探针下载、校验、自检后替换重启
  string upgrade_sha256 = 1;
  string upgrade_platform = 2;
}

message SensorHealthRequest {
  string hostname = 1;
  string health_json = 2;
}
message SensorHealthAck {}

message SensorDownloadRequest {
  string platform = 1;    // 取 SensorRegisterResponse.upgrade_platform
  string sha256 = 2;      // 期望的版本；server 上已换成别的版本时拒绝
}

message SensorChunk {
  bytes data = 1;
}

message FlowBatch {
  string sensor_id = 1;   // 探针所在主机名；绑定证书时必须与证书一致
  repeated FlowRecord flows = 2;
  // 内核丢包累计数，用于判断探针是否过载
  uint64 dropped_packets = 3;
}

message FlowRecord {
  int64 start_unix_ns = 1;
  int64 end_unix_ns = 2;
  string src_ip = 3;      // 规范化五元组的 a 侧
  string dst_ip = 4;      // b 侧
  uint32 src_port = 5;
  uint32 dst_port = 6;
  uint32 protocol = 7;    // IANA 协议号：6=TCP, 17=UDP
  uint64 src_packets = 8;
  uint64 src_bytes = 9;
  uint64 dst_packets = 10;
  uint64 dst_bytes = 11;
  uint32 tcp_flags = 12;  // 会话期间出现过的 TCP 标志位并集
  string dns_query = 13;  // 无则空
  string tls_sni = 14;    // 无则空
  string ja3 = 15;        // TLS 客户端指纹，无则空
  string http_host = 16;
  string http_uri = 17;
  string http_user_agent = 18;
  uint32 dns_rcode = 19;          // DNS 应答码（NOERROR=0，无应答时也是 0），无则 0
  repeated string dns_answers = 20; // A/AAAA 应答 IP（至多 4 个）
  string ja3s = 21;               // TLS 服务端指纹，无则空
  string tls_cert_subject = 22;      // 叶证书 subject CN，无则空（仅 TLS ≤1.2 可见）
  string tls_cert_issuer = 23;       // 叶证书 issuer CN，无则空
  bool tls_cert_self_signed = 24;    // subject DN 与 issuer DN 原始 DER 相等（启发式）
  int64 tls_cert_not_before = 25;    // 有效期起，unix 秒，无则 0
  int64 tls_cert_not_after = 26;     // 有效期止，unix 秒，无则 0
  // 客户端发完 ClientHello 后没有发出任何应用数据（TLS 1.3 除去 Finished）就结束了会话：
  // 只握手不发请求。只在客户端方向 record 跟得上时才置 true，跟丢了宁可不报
  bool tls_handshake_only = 27;
  string tls_version = 28;           // ServerHello 选定的 TLS 版本（如 "TLS 1.3"、"TLS 1.2"），无则空
  string tls_alpn = 29;              // ALPN 应用层协议（如 "h2"、"http/1.1"），服务端选定值优先，无则空
}

message FlowAck {
  uint64 received = 1;
}
