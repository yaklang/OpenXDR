// OpenXDR agent <-> server 通信契约。
// agent 专属通道：注册 + 事件流上报。Zeek/Suricata/syslog 走 server 的独立接入端点，不在此列。
syntax = "proto3";

package openxdr.agent.v1;

option go_package = "openxdr/server/pb";

service AgentService {
  // agent 启动时注册，server 颁发/找回 agent_id
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 独立状态通道，不进入事件积压队列。
  rpc ReportHealth(HealthRequest) returns (HealthAck);
  // 客户端流式上报事件，一条长连接批量推
  rpc ReportEvents(stream AgentEvent) returns (ReportAck);
  // 双向流：agent 保持连接等待指令，执行完把结果回传。
  // agent 主动连出，不需要在被监控主机上开监听端口。
  rpc Commands(stream CommandResult) returns (stream Command);
  // 独立回执确认：确认只代表结果已持久化，不授权重新执行动作。
  rpc ReportCommandResult(CommandResult) returns (CommandResultAck);
  // 下载 server 分发的 agent 安装包，分块流式返回。走已认证的同一条通道，不另开下载地址
  rpc DownloadAgent(DownloadRequest) returns (stream AgentChunk);
}

message DownloadRequest {
  string platform = 1;    // 如 linux-amd64，取 RegisterResponse.upgrade_platform
  string sha256 = 2;      // 期望的版本；server 上已换成别的版本时拒绝，避免拼出半新半旧的文件
}

message AgentChunk {
  bytes data = 1;
}

message Command {
  string id = 1;          // UUID，结果按此关联
  CommandKind kind = 2;
  // 已废弃：平台不再下发演练，恒为 false；agent 忽略此字段。保留字段号兼容已部署的 agent
  bool dry_run = 3;
  // KILL_PROCESS 用：优先按 GUID 校验，pid 会被系统复用
  string process_guid = 4;
  uint32 pid = 5;
  // ISOLATE_HOST 用：隔离期间必须放行的地址，否则 agent 失联后无法解除隔离
  repeated string allow_endpoints = 6;
  // EXEC 用：Linux 交给 sh -c，Windows 交给 PowerShell；timeout_ms 为 0 时用 agent 默认值
  string cmd = 7;
  uint32 timeout_ms = 8;
  // BLOCK_NETWORK / UNBLOCK_NETWORK：IP、网段（CIDR）或域名；QUARANTINE_FILE / RESTORE_FILE：文件绝对路径；
  // DISABLE_ACCOUNT / ENABLE_ACCOUNT：本机账号名；ISOLATE_CONTAINER / UNISOLATE_CONTAINER：容器 ID
  string target = 9;
  // 签名信封：序列化的 SignedCommand 与 server 指令签名私钥对它的 Ed25519 签名。
  // agent 只执行验签通过的信封里的指令，上面的明文字段仅供 server 内部投递与回写，agent 不采信。
  // 签名覆盖的是这串原始字节，不依赖两端对 protobuf 的重新编码一致
  bytes envelope = 10;
  bytes signature = 11;
}

// 签名信封的内容：绑定目标 agent 与有效期，抓到的指令换不了主机、也不能无限期重放
message SignedCommand {
  Command command = 1;    // 其中 envelope / signature 为空
  string agent_id = 2;
  int64 expires_unix = 3;
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  KILL_PROCESS = 1;
  ISOLATE_HOST = 2;
  UNISOLATE_HOST = 3;
  EXEC = 4;
  // 封锁与指定地址的进出通信；域名在执行时解析成地址。解除按原始目标整组删除
  BLOCK_NETWORK = 5;
  UNBLOCK_NETWORK = 6;
  // 把文件移进 agent 的隔离区，记下原路径、权限与哈希；恢复时原路径已有文件则拒绝覆盖
  QUARANTINE_FILE = 7;
  RESTORE_FILE = 8;
  // 锁定本机账号（Linux 锁密码并置过期，公钥登录同样被挡住；Windows 停用账号）
  DISABLE_ACCOUNT = 9;
  ENABLE_ACCOUNT = 10;
  // 隔离容器：target 是容器 ID（docker 系前 12 位，LXC 为 VMID）。进容器自己的网络命名空间丢弃全部流量，
  // 宿主机与其他容器不受影响；用宿主机网络的容器拒绝执行。仅 Linux
  ISOLATE_CONTAINER = 11;
  UNISOLATE_CONTAINER = 12;
}

message CommandResult {
  string agent_id = 1;    // 首条消息用于认领连接，之后每条结果都带上
  string command_id = 2;  // 空表示这是认领连接的首条消息
  Status status = 3;
  string detail = 4;      // 人可读的执行说明或失败原因
  // 以下仅 EXEC 有意义：输出各自截断到 agent 上限，truncated 标记是否发生截断
  int32 exit_code = 5;
  string stdout = 6;
  string stderr = 7;
  bool truncated = 8;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
    UNSUPPORTED = 3;      // 本平台不支持该动作
  }
}

message CommandResultAck {
  string command_id = 1;
}

message RegisterRequest {
  string hostname = 1;
  string os = 2;
  repeated string ip_addrs = 3;
  string agent_version = 4;
  string arch = 5;           // Rust std::env::consts::ARCH，如 x86_64
  string binary_sha256 = 6;  // 当前运行的 agent 二进制哈希，空表示不支持自动升级
}

message RegisterResponse {
  string agent_id = 1; // UUID
  // 采集配置（JSON）。随注册下发，重连即生效——不做热更新：
  // agent 断线重连本就会重新注册，这条路已经够了
  string config_json = 2;
  // 自动升级：server 分发的版本与 agent 当前二进制不同时给出，agent 下载、校验、自检后替换重启。
  // 分发目录里放的是哪个版本，整片主机就收敛到哪个版本
  string upgrade_sha256 = 3;
  string upgrade_platform = 4;
  // 指令签名公钥（Ed25519，32 字节）。agent 首次见到即固定在本地，之后只认这把；
  // 与固定值不同时拒绝一切指令，不随注册响应更换
  bytes command_signer = 5;
  // 升级安装包的发布签名（Ed25519，64 字节）：对 "openxdr-agent-release-v1\0" + 平台 + "\0" + 安装包 SHA-256（小写十六进制）签名，
  // 私钥不在 server 上。编译时嵌了发布公钥的 agent 只接受签名有效的安装包；分发目录没放 .sig 时为空
  bytes upgrade_signature = 6;
}

message AgentEvent {
  string agent_id = 1;     // UUID，Register 颁发
  int64 ts_unix_ns = 2;    // 事件时间，unix 纳秒
  uint32 class_uid = 3;    // OCSF class（1007=进程活动, 4001=网络活动, ...）
  string process_guid = 4; // UUID，agent 生成的全局进程标识；无则空
  string username = 5;
  string conn_tuple = 6;   // "proto:src:sport>dst:dport"；无则空
  string raw_json = 7;     // 归一化后的完整 OCSF 事件体（JSON）
  // 父进程 GUID，进程血缘的唯一来源。空表示父进程未被本 agent 观察到
  string parent_process_guid = 8;
  // 采集队列满而丢弃的事件累计数，用于判断 agent 是否过载
  uint64 dropped_events = 9;
}

message ReportAck {
  uint64 received = 1;
}

message HealthRequest {
  string agent_id = 1;
  string health_json = 2;
}
message HealthAck {}
