// OpenXDR agent <-> server 通信契约。
// agent 专属通道：注册 + 事件流上报。Zeek/Suricata/syslog 走 server 的独立接入端点，不在此列。
syntax = "proto3";

package openxdr.agent.v1;

option go_package = "openxdr/server/pb";

service AgentService {
  // agent 启动时注册，server 颁发/找回 agent_id
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 客户端流式上报事件，一条长连接批量推
  rpc ReportEvents(stream AgentEvent) returns (ReportAck);
  // 双向流：agent 保持连接等待指令，执行完把结果回传。
  // agent 主动连出，不需要在被监控主机上开监听端口。
  rpc Commands(stream CommandResult) returns (stream Command);
}

message Command {
  string id = 1;          // UUID，结果按此关联
  CommandKind kind = 2;
  // 只做不改：dry_run 时执行器只报告"将会做什么"，不产生任何实际影响
  bool dry_run = 3;
  // KILL_PROCESS 用：优先按 GUID 校验，pid 会被系统复用
  string process_guid = 4;
  uint32 pid = 5;
  // ISOLATE_HOST 用：隔离期间必须放行的地址，否则 agent 失联后无法解除隔离
  repeated string allow_endpoints = 6;
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  KILL_PROCESS = 1;
  ISOLATE_HOST = 2;
  UNISOLATE_HOST = 3;
}

message CommandResult {
  string agent_id = 1;    // 首条消息用于认领连接，之后每条结果都带上
  string command_id = 2;  // 空表示这是认领连接的首条消息
  Status status = 3;
  string detail = 4;      // 人可读的执行说明或失败原因

  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
    UNSUPPORTED = 3;      // 本平台不支持该动作
  }
}

message RegisterRequest {
  string hostname = 1;
  string os = 2;
  repeated string ip_addrs = 3;
  string agent_version = 4;
}

message RegisterResponse {
  string agent_id = 1; // UUID
  // 采集配置（JSON）。随注册下发，重连即生效——不做热更新：
  // agent 断线重连本就会重新注册，这条路已经够了
  string config_json = 2;
}

message AgentEvent {
  string agent_id = 1;     // UUID，Register 颁发
  int64 ts_unix_ns = 2;    // 事件时间，unix 纳秒
  uint32 class_uid = 3;    // OCSF class（1007=进程活动, 4001=网络活动, ...）
  string process_guid = 4; // UUID，agent 生成的全局进程标识；无则空
  string username = 5;
  string conn_tuple = 6;   // "proto:src:sport>dst:dport"；无则空
  string raw_json = 7;     // 归一化后的完整 OCSF 事件体（JSON）
  // 父进程 GUID，进程血缘的唯一来源。空表示父进程未被本 agent 观察到
  string parent_process_guid = 8;
  // 采集队列满而丢弃的事件累计数，用于判断 agent 是否过载
  uint64 dropped_events = 9;
}

message ReportAck {
  uint64 received = 1;
}
