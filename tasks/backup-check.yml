id: backup-check
name: 备份验证
name_en: Backup verification
category: ops
description: "按记忆里登记的备份位置，检查最近一次备份是否成功、是否在时间窗内"
description_en: "Check the latest backup succeeded and is recent, using backup locations recorded in memory"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 9 * * *"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  验证本组的备份是否按时完成。备份方式因环境而异，以 memories 为准：
  1. 读 memories 里关于备份的条目（备份工具、位置、周期、负责主机）。没有任何备份登记时：用 track 登记一条 backup:unregistered，
     说明需要人在「AI 记忆」里写明备份方式，本轮 level 写 ok，不要猜测备份在哪。
  2. 对登记的每项备份，用只读命令核对：最近一份备份文件或快照的时间与大小、备份任务的日志或退出状态
     （如 Proxmox vzdump 日志、restic/borg snapshots、数据库 dump 文件、Windows wbadmin get versions）。
  3. 判定：超过登记周期 1.5 倍没有新备份、大小骤降超过 50%、日志报错，均视为失败。
  待办 key 用 backup: 前缀（如 backup:<主机>:<备份名>），恢复正常后标 resolved。
  全部正常时 level 写 ok；关键系统备份已中断超过两个周期写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
