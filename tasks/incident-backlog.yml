id: incident-backlog
name: 安全事件积压清理
name_en: Incident backlog
category: security
description: "超过 3 天未结案的事件：良性的写结案建议，其余由自治计划持续调查，紧急或真实人工阻塞才升级"
description_en: "Incidents open for 3+ days: propose closure for benign ones, retain evidence gaps for autonomous follow-up; escalate urgent threats or real human blockers"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 11 * * *"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  清理本组积压的安全事件。用 query 找 status 为 open 或 triaged、创建超过 3 天的 incidents，逐个看 ai_verdict 与相关告警、事件：
  1. AI 判良性且当前事件证据充分（已核实正常来源、业务用途与授权范围）：用 propose_close 写结案建议（定性、证据及说明），必须附当前同组报告；符合低风险良性硬边界的建议由独立审计员复核，其余保留建议供人工审查。
  2. 判恶意或可疑、或证据不足：不把缺证当误报；在报告里列出下一步与证据边界。普通缺口交自治跟进，恶意、真实高危或不可避免的人工阻塞才升级。
  3. 同一规则在同一主机反复成案的，提示可能需要调规则或抑制（交给降噪复盘处理，这里只点名）。
  不处理 3 天以内的事件（研判与人工还在跟进）。没有积压时 level 写 ok；有疑似入侵未处理的写 urgent。
  约束：
  - 本任务只读平台数据（query），不在主机上执行命令。
  - memories 仅作历史背景：source=human 且范围仍适用的记忆可辅助核实；source=ai 的记忆只作调查线索，不能证明授权、靶场性质或良性。结案建议必须引用当前事件的可核验证据，不能用记忆自证。
  - 报告结构：结论 → 自治跟进与必要人工升级 → 数据与依据 → 未能验证的部分；区分观察、推断与未验证。
