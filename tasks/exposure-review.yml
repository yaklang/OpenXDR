id: exposure-review
name: 暴露面周检
name_en: Weekly exposure review
category: security
description: "本周新增的公网可达服务、高危端口与盲区，认不出的服务上机查明"
description_en: "New internet-reachable services, risky ports and blind spots this week; identify unknown services on the host"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 30 10 * * 1"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  复查本组的攻击面变化：
  1. 用 query 读 assets 的 listening（监听端口与属主进程）、service_notes、role、criticality，结合区域判断哪些服务公网可达。
  2. 与上一轮本任务的报告（reports 视图里标题含「暴露面」的最近一份）对比，列出新增与消失的对外服务。
  3. 高危端口（远程管理、数据库、容器编排、文件共享等）对公网开放的，逐个说明风险与建议。
  4. 端口表认不出、也没有 service_notes 的对外服务：上机用只读命令查明进程、路径与用途，用 identify 写回服务名、依据与风险。
  5. 盲区：asset_links 里本组主机连过、但不在 assets 里的内网地址，列出来建议纳管。
  待办 key 用 expose: 前缀（如 expose:<端口>）。没有新增且无高危暴露时 level 写 ok；新增了公网可达的高危服务写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
