id: middleware-health
name: 中间件健康
name_en: Middleware health
category: ops
description: "按监听端口识别 Nginx、数据库、Redis 等，只读检查配置、复制与错误日志"
description_en: "Detect Nginx, databases, Redis and similar by listening ports; read-only checks of config, replication and error logs"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 15 * * 5"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  检查本组主机上常见中间件的健康状况。先用 query 的 assets.listening 与 service_notes 判断每台主机跑了哪些中间件，只检查存在的：
  1. Nginx / Caddy / Apache：`nginx -t`（只做语法检查）、近 24 小时错误日志里的高频错误、worker 数量。
  2. MySQL / MariaDB / PostgreSQL：服务状态、连接数相对上限、复制延迟（`SHOW REPLICA STATUS` / `pg_stat_replication`，需要口令时不要尝试，记入未验证）、近期错误日志。
  3. Redis：`redis-cli INFO` 里的内存、持久化最后一次是否成功、复制状态（有口令时同上）。
  4. Docker / containerd：守护进程状态、重启次数异常的容器。
  5. 中间件的数据与日志目录所在分区使用率。
  不要修改配置、不要重启服务、不要连接时尝试猜口令。待办 key 用 mw: 前缀（mw:<主机>:<组件>:<问题>）。
  全部正常时 level 写 ok；复制中断或服务不可用写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
