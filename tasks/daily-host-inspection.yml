id: daily-host-inspection
name: 每日主机巡检
name_en: Daily host inspection
category: ops
description: "每天一次广而浅的巡检：容量、服务、时间同步、账户、登录、监听与外联，并逐条复查遗留待办"
description_en: "A broad daily sweep: capacity, services, time sync, accounts, logons, listeners and egress, plus a review of every open finding"
# 五段 cron；不写 CRON_TZ 时按 server 本地时区（容器里通常是 UTC），这里固定北京时间上午 10 点。
# 放在工作时间：巡检里命中高风险名单的命令要组管理员批准，凌晨跑时没人批，到期全部作废
schedule: "CRON_TZ=Asia/Shanghai 0 10 * * *"
# 留空使用平台默认模型
model: ""
# "*" 表示每个组各跑一次；也可写组名
targets: { group: "*" }
# 命中组内 AI 高风险名单的命令等管理员批准的上限，到期不执行。白天有人值守，给够看通知、核对命令的时间，
# 又不至于耗光 30 分钟运行时长
approval_timeout: 10m
# 命令一律真执行：名单外的直接下发，命中高风险名单的等组管理员批准；RESPONSE_ENABLED=true 时才会下发
prompt: |
  对本组每台主机做一次运维与安全巡检，覆盖：
  1. 运维：磁盘与 inode 使用率、内存与负载、异常退出或频繁重启的服务、时间同步。
  2. 安全：新增或可疑的账户与 sudo 权限、监听端口与对外连接、计划任务与自启动项、
     近 24 小时的登录失败与异地登录、平台已有的未处理告警与 incident。
  3. 平台告警用 query 按主机拆开：近 24 小时每台主机命中了哪些规则、级别与次数，
     以及仍处于 triaged（未人工结案）的 incident 标题与 AI 结论。
  4. 待办闭环（本任务全量复查）：先逐条复查 open_findings（遗留待办），已修复的 track 标 resolved，仍存在的 track 标 open；
     本次新发现、需要人处理的问题逐个用 track 登记。ignored_findings 是人工忽略的，不再报。
  5. 先看 memories：标了「待复核」的 AI 记忆可能已过时。其中「无法核实 / 查不了 / 没有工具」这类否定性结论每轮都要重新试——
     用一两条廉价的只读命令（command -v 若干同类工具、dpkg -l | grep 关键词、ls 常见安装目录、dmesg / /sys 里的同类信息），
     试出新手段就 forget 旧的、remember 新的（写清用什么命令能查到），并按新手段把本轮该查的查完；仍做不到就原样再 remember 一次刷新复核时间。
  巡检只使用只读命令。命令在等待批准或执行失败时，在报告中如实注明，不要换一种写法绕过。
  只读命令自动放行；不写临时文件（结果直接走管道），密码文件只看 stat / ls 元数据不读内容。
  确需读密钥内容或改动的操作单独成一条命令，别和其它检查拼在一起：它要等人批准，拼在一起整批都拿不到结果。
  最后用 report 提交一份精炼报告（没有需要人处理的事项 level 写 ok，只存档不推送；有新增或仍未解决的写 attention；疑似入侵写 urgent），
  按 skill 里的统一格式（全文控制在 1,500–2,500 字以内）：一句话结论写清异常数、最要紧的事与本轮 AI 自治动作；
  「## 已执行的操作」提前列出本轮已自主完成的待办同步、记忆写入等；「## 需要人处理」分新增、仍未解决、本轮已修复三类（每条限 1–2 行，带 🔴/🟡/✅ 标记）；
  「## 证据」仅异常先行（无异常主机合并成一张紧凑表格或一句话，严禁逐台展开正常项；异常主机每台最多 4 条核心证据），「## 推断」「## 未验证」简短单行列表。
