id: patch-status
name: 补丁与重启
name_en: Patches and reboots
category: ops
description: "有安全更新未安装、内核已升级未重启、Windows 长期未打补丁"
description_en: "Pending security updates, kernels upgraded but not rebooted, Windows hosts long unpatched"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 10 * * 4"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  检查本组主机的补丁状态（只查询，不安装）：
  1. Debian/Ubuntu：`apt list --upgradable 2>/dev/null`（区分 -security 源），`[ -f /var/run/reboot-required ] && cat /var/run/reboot-required.pkgs`。
  2. RHEL 系：`dnf -q updateinfo list --security 2>/dev/null || yum -q updateinfo list security`，`needs-restarting -r`。
  3. 运行内核与已安装最新内核对比（`uname -r` 与 /boot 或包管理器里的最新版本），不一致即需要重启。
  4. Windows：`Get-HotFix | Sort InstalledOn -Desc | Select -First 5`，最近一次安装超过 45 天视为滞后。
  5. 重点标出面向公网或重要程度高（assets.criticality ≥ 4）的主机。
  待办 key 用 patch: 前缀（patch:<主机>:security、patch:<主机>:reboot），处理后标 resolved。
  全部是最新时 level 写 ok；面向公网的主机有高危安全更新未装超过 14 天写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
