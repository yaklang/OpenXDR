id: capacity-trend
name: 容量趋势预测
name_en: Capacity forecast
category: ops
description: "磁盘、inode 与内存的增长趋势，预测还有多久写满"
description_en: "Disk, inode and memory growth trends with a forecast of when they fill up"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 14 * * 5"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  预测本组主机的容量风险：
  1. 每台主机用只读命令取磁盘与 inode 使用率（`df -hPT`、`df -iP`）、内存与 swap（`free -m`），Windows 用 `Get-PSDrive -PSProvider FileSystem`。
  2. 与上一轮本任务的报告（reports 视图里标题含「容量」的最近一份）比较，算出各分区一周的增长量，按当前速度估算写满日期。
  3. 增长最快的分区，用 `du -xh --max-depth=2 <挂载点> 2>/dev/null | sort -h | tail` 找出主要增长目录（日志、备份、容器镜像等）。
  4. 30 天内会写满或使用率已超过 85% 的登记待办，写清增长来源与建议（清理、扩容、调日志轮转）。
  报告里放一张「主机 / 分区 / 当前使用率 / 周增长 / 预计写满」的表格，供下一轮对比。
  待办 key 用 capacity: 前缀（capacity:<主机>:<挂载点>）。没有 30 天内的风险时 level 写 ok；7 天内会写满写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
