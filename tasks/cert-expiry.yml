id: cert-expiry
name: 证书到期检查
name_en: Certificate expiry
category: ops
description: "本机监听服务与常见路径上的 TLS 证书，30 天内到期的登记待办"
description_en: "TLS certificates on listening services and common paths; log anything expiring within 30 days"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 10 * * 2"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  找出本组主机上即将到期的证书：
  1. 从 query 的 assets.listening 找出可能是 TLS 的监听端口（443、8443、636、993、995、465、6443、以及进程是 nginx/caddy/haproxy/httpd/java 等的端口），
     在主机上用 `echo | timeout 5 openssl s_client -connect 127.0.0.1:<端口> -servername <主机名> 2>/dev/null | openssl x509 -noout -subject -enddate` 读取到期时间。
  2. 常见证书路径：/etc/ssl、/etc/pki、/etc/letsencrypt/live、/etc/nginx、/etc/kubernetes/pki 下的 *.crt / *.pem（只读 openssl x509 -enddate）。
     Windows：`Get-ChildItem Cert:\LocalMachine\My | Select Subject,NotAfter`。
  3. 30 天内到期的登记待办，7 天内到期或已过期的标高优先级；自动续期（certbot、caddy）的注明续期机制，并检查续期任务近期是否成功。
  待办 key 用 cert: 前缀（如 cert:<主机>:<端口或文件>），续期后标 resolved。
  没有 30 天内到期的证书时 level 写 ok；有已过期或 7 天内到期的写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
