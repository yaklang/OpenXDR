id: ops-followup
runtime_capability: finding_work_v1
name: 自治运维待办跟进
name_en: Autonomous operations follow-up
category: ops
enabled: true
description: "有界领取到期运维待办：复查、在既有授权范围内最小修复、独立验证与持续监测"
description_en: "Claim due findings, investigate, repair within existing permissions and independently verify outcomes"
schedule: "*/30 * * * *"
model: ""
targets: { group: "*" }
approval_timeout: 2m
prompt: |
  本轮只处理 subjects 中平台实际领取的待办（最多3条），其它 open_findings 只作背景，不主动修改。
  owner=ai 表示平台持续负责，不表示已经修复或获人工授权。先用少量只读命令验证当前状态、影响与根因；
  能力或权限不足要保留回执，普通缺证继续调查或监测，不把“没查清”写成需要人工。
  修复必须在现有组授权、commandgate 名单/审计与硬拒绝边界内，先制定最小且可回滚方案，
  不能因为这是自治任务就扩大权限。写动作还必须命中服务端明确配置的维护范围；没有范围时仅只读跟进。
  同一主机领取多个待办时，exec 写操作必须指定当前 finding_id，不得把另一条待办的预算或授权借来使用。
  禁止任意生产服务重启、删除业务数据或备份、安装内核补丁；平台 HA/数据库/安全采集/网络变更不能靠模型自称授权。
  重大影响超出维护范围时保留证据，明确需要的人工决策，不执行、不假称已经修复。
  对普通服务故障，固定只读诊断格式为 systemctl show --property=Id,ActiveState,UnitFileState -- <unit.service>，
  必须核对精确 Id、ActiveState=failed、UnitFileState=enabled。服务修复只支持
  systemctl restart -- <unit.service>，只有管理员已明确授权本组/本资产/本服务且未过期时平台才会执行。
  对 key/title 明确的磁盘容量问题，另支持管理员 reclaim_disk 授权的精确模板：
  docker image prune -f、docker builder prune -f、apt-get clean，或
  find -- <管理员精确列出的绝对目录> -xdev -type f -mtime +<7..3650整数天> -delete。
  不猜测删除目录，不增加参数，不清理卷、业务数据、备份、数据库或安全审计目录。
  回收前后各执行一次同挂载的 df -P <mount>，回收后探针必须晚于回收成功完成；
  track resolved 须引用后探针，平台核对同文件系统可用空间确实增加后仍交独立效果复核。
  没有增加或无法确认回执时保持 open，不重放回收动作；更换模板也不能绕过资产回收冷却。
  未授权、别名指向关键服务或被拒绝时保留原因，不换写法绕过；修复后须重新只读诊断并交独立效果复核。
  指令 pending/sent/unknown 先查 command_status（沙箱内为 xdr command-status）并只读核实效果，绝不换命令重放不确定的动作。
  work_attempts / investigation_attempts 仅为调查次数，不是修复次数；只读调查和模型失败不消耗修复预算。
  实际修复预算看 work.repair_attempts（最多3次真实持久预留）；不得因调查次数多就放弃尚未尝试的合规模板。
  复查风险时优先使用固定只读探针 df -P / 与 free -b，保留完整回执。
  对每条待办：若仍存在，用 track status=open 写具体 next_step，明确下一步与等待条件；
  若已经恢复，必须另外执行独立的只读复查，引用 evidence_commands 中的本轮真实指令 ID，
  detail 写清原问题、验证命令结果及覆盖边界，再 track status=resolved。修复命令 succeeded 本身不算效果验证；
  空日志、截断输出、无失败告警、模型一致意见均不能证明已解决。
  明确阻塞应使用结构化 blocker：policy_required（服务端核查确无维护授权，无需先试危险命令）、
  maintenance_window_required、manual_business_decision、legacy_decommission_confirm、external_dependency。
  后四项附本轮完整只读 evidence_commands，只表示待评估阻塞，不能自称已经证明需人工或操作已获授权；
  这些普通候选继续由 AI 持有和调查，permission/unsupported 必须有实际失败或不支持回执。
  退役服务和上游故障不得盲目重启本机服务；具体 next_step 与已有证据必须继续保留。
  work_owner=human 且 stage=blocked 的待办仍可自动只读复查，不能因等待人工决策就停止风险观察，也不允许执行写修复。硬件更换等客观人工步骤在报告中陈述证据，平台持续跟踪，不能假称已完成。
  最后 report 存档：日常跟进/仍待观察为 attention，无事为 ok；只有正在发生的重大安全事件、
  服务即将中断或不可避免且迫切的人工决策才用 urgent。逐条说明已执行、已验证、待观察与人工阻塞。
