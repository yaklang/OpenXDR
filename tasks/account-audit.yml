id: account-audit
name: 账户与权限审计
name_en: Account and privilege audit
category: security
description: "UID 0 账户、sudo 权限、新增的 SSH 公钥、长期未用账户与 Windows 本地管理员"
description_en: "UID-0 accounts, sudo rights, new SSH keys, dormant accounts and Windows local admins"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 14 * * 2"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  审计本组主机的账户与权限：
  1. Linux：`awk -F: '$3==0{print $1}' /etc/passwd`（除 root 外的 UID 0）、`getent group sudo wheel`、`grep -rhv '^#' /etc/sudoers /etc/sudoers.d 2>/dev/null | grep -v '^$'`（NOPASSWD 与 ALL 单独列出）、
     可登录 shell 的账户、`lastlog -b 90`（90 天以上未登录但仍可登录的账户）、空口令账户（`awk -F: '$2==""' /etc/shadow`，读不了就记未验证）。
  2. SSH 公钥：列出各账户 authorized_keys 的公钥指纹（`ssh-keygen -lf`）与修改时间，与上一轮报告（reports 里标题含「账户」的最近一份）比较，标出新增的公钥。
  3. Windows：`Get-LocalGroupMember Administrators`、`Get-LocalUser | Select Name,Enabled,LastLogon,PasswordExpires`。
  4. 与 memories 里登记的已知运维账户对照，未登记的新增特权账户重点说明。
  待办 key 用 account: 前缀（account:<主机>:<账户或问题>）。没有新增或可疑项时 level 写 ok；发现未知的新增特权账户或公钥写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
