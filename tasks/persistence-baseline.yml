id: persistence-baseline
name: 持久化点基线复核
name_en: Persistence baseline review
category: security
description: "cron、systemd、预加载库、Windows 自启动与计划任务，与记忆里的基线对比"
description_en: "Cron, systemd, preload libraries, Windows autoruns and scheduled tasks, compared with the baseline in memory"
# 预设任务默认关闭，在「定时任务」页按组开启；时间错开，避免同时占满并发
enabled: false
schedule: "CRON_TZ=Asia/Shanghai 0 14 * * 3"
model: ""
targets: { group: "*" }
approval_timeout: 10m
prompt: |
  复核本组主机的持久化点有没有偏离基线：
  1. Linux：`ls -la /etc/cron.* /var/spool/cron/crontabs 2>/dev/null`、各用户 crontab、`systemctl list-unit-files --state=enabled --type=service`、
     `find /etc/systemd/system /usr/lib/systemd/system -newer /etc/hostname -name '*.service' 2>/dev/null`、`cat /etc/ld.so.preload 2>/dev/null`、`ls -la /etc/rc.local /etc/profile.d`。
  2. Windows：`Get-ScheduledTask | ? State -ne Disabled | Select TaskPath,TaskName`、`Get-CimInstance Win32_StartupCommand`、
     注册表 Run / RunOnce、`Get-Service | ? StartType -eq Automatic`。
  3. 平台侧：用 query 查近 7 天 class_uid 201002（注册表）与持久化相关告警，作为线索。
  4. 基线：读 memories 里「持久化基线」的条目。没有基线时，把本轮看到的条目整理成简明清单，用 remember 记为该主机的基线（只记正常项的摘要），本轮 level 写 ok。
     有基线时，只报告新增与被修改的条目，逐个判断来源（软件安装、运维变更还是可疑）。确认是正常变更的，更新基线记忆。
  待办 key 用 persist: 前缀。没有偏离时 level 写 ok；出现来源不明、指向 /tmp、/dev/shm 或编码命令的条目写 urgent。
  约束：
  - 只用只读命令；命令被审计员拒绝或执行失败时，在报告里如实注明，不要换一种写法绕过。
  - 先用 memories 看本组已知的环境知识（哪些是正常的、各类东西在哪），用得上就用；查明的、以后用得上的环境事实用 remember 记下。
  - 主机系统不同（Linux / Windows）用对应命令；主机离线或命令不可用的，写进「未能验证」。
  - 报告结构：结论 → 需要人处理的事项（新增 / 仍未解决 / 本轮已修复）→ 按主机的证据 → 未能验证的部分；区分观察、推断与未验证。
