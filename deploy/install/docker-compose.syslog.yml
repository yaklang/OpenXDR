# 可选 Syslog 接入：docker compose -f docker-compose.yml -f docker-compose.syslog.yml up -d
# 只向可信转发设备开放；容器内以非 root（uid 10001）监听 5514，宿主机默认映射 514（冲突时可用 SYSLOG_PORT 覆盖）。
services:
  server:
    environment:
      SYSLOG_ADDR: ":5514"
    ports:
      - "${SYSLOG_PORT:-514}:5514/tcp"
      - "${SYSLOG_PORT:-514}:5514/udp"
