scope: openxdr
namespace: /openxdr/
name: __NODE_NAME__

# REST API 仍监听全部地址：对端 HAProxy 用 HEAD /primary 判主、两端 Prometheus 抓 /metrics、
# Patroni 之间互相 GET 状态，都要跨节点访问。这些只读接口不需要口令；会改变集群的接口
# （PATCH/PUT /config、POST /restart /reload /switchover /failover /reinitialize 等）要求下面的
# Basic 认证。来源地址由宿主机防火墙 guard.sh 收窄到本机、两个节点与 VIP（可选监控主机）。
# 容器内 patronictl -c /etc/patroni/patroni.yml 会自动带上这组凭据。
restapi:
  listen: 0.0.0.0:8008
  connect_address: __NODE_IP__:8008
  authentication:
    username: patroni-admin
    password: __PATRONI_RESTAPI_PASSWORD_YAML__

etcd3:
  hosts:
    - __DCS_HOST__:2379
  protocol: https
  cacert: /run/secrets/ha-ca.crt
  cert: /run/secrets/etcd-client.crt
  key: /run/secrets/etcd-client.key

bootstrap:
  post_bootstrap: /etc/patroni/post-bootstrap.sh
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: false
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        password_encryption: scram-sha-256
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 512MB
  initdb:
    - encoding: UTF8
    - data-checksums
  # openxdr 角色由 post-bootstrap.sh 创建（Patroni 4 已不支持 bootstrap.users），
  # replicator 角色由 Patroni 按 postgresql.authentication.replication 创建并设口令。

postgresql:
  listen: 0.0.0.0:5432
  connect_address: __NODE_IP__:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/local/bin
  authentication:
    superuser:
      username: postgres
      password: __POSTGRES_PASSWORD_YAML__
    replication:
      username: replicator
      password: __REPLICATION_PASSWORD_YAML__
  parameters:
    unix_socket_directories: /var/run/postgresql
  # pg_hba 写在本地配置而不是 bootstrap.dcs：本地 postgresql.* 优先于 DCS 里的动态配置，
  # 经 REST API 或 etcd 改动态配置里的 pg_hba 不会生效；Patroni 每次启动按这里重写
  # pg_hba.conf，initdb 默认留下的 127.0.0.1 / ::1 trust 行也一并去掉。
  # - local trust：unix socket 只在容器里，能连上它的进程已经是容器内 postgres 用户、
  #   可以直接读数据目录；备份脚本经 docker exec 走这里。
  # - 127.0.0.1：Patroni 自己经 TCP 连本机（未开 use_unix_socket），超级用户口令在 initdb 时写入；
  #   备库读本机时间线（切换、pg_rewind 前）用 replicator 走复制连接连 127.0.0.1。
  # - 两个节点：HAProxy 从节点地址转发应用连接；复制与 pg_rewind 也从节点地址发起，
  #   切换后任一节点都可能是备库，所以两个节点都要有 replication 行。
  # VIP 只是目的地址，没有客户端以它为源地址连数据库，不必列出。其余来源一律没有匹配行。
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 scram-sha-256
    - host replication replicator 127.0.0.1/32 scram-sha-256
    - host replication replicator 10.1.1.198/32 scram-sha-256
    - host replication replicator 10.1.1.197/32 scram-sha-256
    - host all all 10.1.1.198/32 scram-sha-256
    - host all all 10.1.1.197/32 scram-sha-256

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
