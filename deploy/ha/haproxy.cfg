global
  log stdout format raw local0

defaults
  log global
  timeout connect 3s
  timeout client 5m
  timeout server 5m

frontend postgres_primary
  bind 127.0.0.1:15432
  mode tcp
  default_backend patroni_primary

backend patroni_primary
  mode tcp
  option httpchk HEAD /primary
  http-check expect status 200
  server node1 10.1.1.198:5432 check port 8008
  server node2 10.1.1.197:5432 check port 8008

frontend openxdr_http
  bind *:8080
  mode http
  option httplog
  http-request deny if { path_beg /metrics }
  default_backend openxdr_http_nodes

backend openxdr_http_nodes
  mode http
  option httpchk GET /readyz
  http-check expect status 200
  balance roundrobin
  server node1 10.1.1.198:18080 check
  server node2 10.1.1.197:18080 check

frontend openxdr_grpc
  bind *:8081
  mode tcp
  option tcplog
  default_backend openxdr_grpc_nodes

backend openxdr_grpc_nodes
  mode tcp
  balance leastconn
  server node1 10.1.1.198:18081 check
  server node2 10.1.1.197:18081 check
