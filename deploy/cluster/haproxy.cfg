global
  log stdout format raw local0

defaults
  log global
  timeout connect 5s
  timeout client 5m
  timeout server 5m

frontend openxdr_http
  bind *:8080
  mode http
  option httplog
  http-request deny if { path_beg /metrics }
  default_backend openxdr_http_nodes

backend openxdr_http_nodes
  mode http
  option httpchk GET /readyz
  http-check expect status 200
  balance roundrobin
  server server1 server1:8080 check
  server server2 server2:8080 check
  server server3 server3:8080 check

frontend openxdr_grpc
  bind *:8081
  mode tcp
  option tcplog
  default_backend openxdr_grpc_nodes

backend openxdr_grpc_nodes
  mode tcp
  balance leastconn
  server server1 server1:8081 check
  server server2 server2:8081 check
  server server3 server3:8081 check
