# 按路径决定缓存策略：由 server 块统一输出，避免子 location 写 add_header 覆盖安全头。
# 未命中（含 /api/）为空串时 nginx 不会下发该头，不干扰后端自带的 Cache-Control。
map $uri $static_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    /index.html "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # 安全头：CSP 只放同源脚本；antd 的 CSS-in-JS 在运行时插 style，style-src 需留内联。
    # HSTS 由 Caddy（真正对外终止 TLS 的那层）发，内层 nginx 只跑 HTTP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # 不带 always：404/5xx 错误响应不享受静态资源强缓存
    add_header Cache-Control $static_cache_control;

    # 只管带扩展名的构建产物：缺失的哈希文件直接 404，不回落成 index.html；
    # /assets/<id> 是前端的资产详情路由，得落到下面的 SPA 回落
    location ~ ^/assets/.+\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # 文档上传最多 20 MiB；AI 解析最多三分钟。
    location /api/host-import/ {
        client_max_body_size 40m;
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 诱饵远程安装经 SSH 推送约 20 MB 运行端，服务端最长两分钟。
    location /api/decoy-install/ {
        proxy_read_timeout 200s;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端与 API 同源，避免 CORS
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        # 带上客户端地址，server 按 TRUSTED_PROXIES 还原，登录退避与审计才按真人计
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 会话 cookie 的 Secure 属性看 X-Forwarded-Proto：Caddy 已按原始协议覆盖写入，
        # 这里原样透传（nginx 默认转发请求头），不能改成 $scheme，那会永远得到 http。
    }
}
