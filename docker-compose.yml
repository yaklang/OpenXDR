services:
  nats:
    image: nats:2.11-alpine
    command: ["--config", "/etc/nats/openxdr.conf", "--http_port", "8222"]
    volumes:
      - natsdata:/data
      - ./deploy/nats.conf:/etc/nats/openxdr.conf:ro
    ports:
      # 监控端口只给本机看，不对外开
      - "127.0.0.1:8222:8222"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openxdr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openxdr}
      POSTGRES_DB: openxdr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openxdr"]
      interval: 5s
      retries: 10

  server:
    stop_grace_period: 30s  # 停机时等进行中的定时任务把运行记成 interrupted，交给接手的节点重跑；Docker 默认只给 10 秒
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://openxdr:${POSTGRES_PASSWORD:-openxdr}@postgres:5432/openxdr?sslmode=disable
      NATS_URL: nats://nats:4222
      QUEUE_SHARDS: ${QUEUE_SHARDS:-32}
      QUEUE_REPLICAS: 1
      RULES_PATH: /rules
      TEMPORAL_RULES_PATH: ${TEMPORAL_RULES_PATH:-}
      IDENTITY_SOURCES_JSON: ${IDENTITY_SOURCES_JSON:-}
      # 目录来源的 tokenEnv 引用的变量要在这里透传进容器；用别的变量名时照此加一行
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN:-}
      IDENTITY_RUN_RETENTION_DAYS: ${IDENTITY_RUN_RETENTION_DAYS:-30}
      TASKS_PATH: /tasks
      # AI 研判：留空则不启用。接本地 Ollama 时用 host.docker.internal
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Pi 对话与预设任务：留空则不启用，与模型端点共用 AI_BASE_URL / AI_API_KEY
      PI_MODEL: ${PI_MODEL:-}
      # 自部署 vLLM 且模型名是路径（如 /model）时设 true，后台短输出才能关掉思考
      AI_TEMPLATE_NO_THINKING: ${AI_TEMPLATE_NO_THINKING:-false}
      # 每组近 24 小时 Pi 用量上限（输入加输出 token），0 不限
      PI_GROUP_DAILY_TOKENS: ${PI_GROUP_DAILY_TOKENS:-0}
      # 配置后 Pi 在独立沙箱主机的隔离容器里运行，见 docs/pi-backend.md#沙箱模式
      SANDBOX_URL: ${SANDBOX_URL:-}
      SANDBOX_KEY: ${SANDBOX_KEY:-}
      SANDBOX_CA_FILE: ${SANDBOX_CA_FILE:-}
      # 首次启动的 admin 密码；不设则随机生成并打印在 server 日志里
      ABUSE_CH_AUTH_KEY: ${ABUSE_CH_AUTH_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 告警通知：留空不推送。格式 generic / dingtalk / feishu / wecom
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-generic}
      # 消息里控制台链接的前缀，如 http://xdr.internal:5173
      WEBHOOK_LINK_BASE: ${WEBHOOK_LINK_BASE:-}
      # 低于该级别的事件不推送（1~5），0 表示全推
      WEBHOOK_MIN_SEVERITY: ${WEBHOOK_MIN_SEVERITY:-0}
      # syslog 接入：留空不启用，如 ":514"（记得同时映射端口）
      SYSLOG_ADDR: ${SYSLOG_ADDR:-}
      # 响应处置：结束进程 / 主机隔离
      RESPONSE_ENABLED: ${RESPONSE_ENABLED:-false}
      ISOLATION_ALLOW: ${ISOLATION_ALLOW:-}
      # 自动响应：AI 高置信度判恶意时自动隔离主机，默认关闭；开了就是真执行
      AUTO_RESPONSE_ENABLED: ${AUTO_RESPONSE_ENABLED:-false}
      AUTO_RESPONSE_EXEMPT: ${AUTO_RESPONSE_EXEMPT:-}
      # 原始事件保留天数
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # 生产采集端必须使用 mTLS；三项同时设置才启用
      TLS_CA_FILE: ${TLS_CA_FILE:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      # 控制台「添加主机」一键接入：agent 连 server 的 gRPC 地址（主机上能访问到的），
      # 开了 mTLS 时再配 CA 私钥用于签发主机证书；agent 安装包放在 ./dist
      ENROLL_GRPC_URL: ${ENROLL_GRPC_URL:-}
      TLS_CA_KEY_FILE: ${TLS_CA_KEY_FILE:-}
      AGENT_DIST_DIR: /dist
      # 采信 X-Forwarded-For 的上游（逗号分隔的地址或网段），填 web 容器所在网段与前置反向代理；
      # 留空则不还原，登录退避与审计看到的都是 web 容器的地址
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 文档中的登录凭据独立加密保存；HA 节点必须使用同一密钥
      HOST_CREDENTIAL_KEY: ${HOST_CREDENTIAL_KEY:-}
      ENROLL_PUBLIC_URL: ${ENROLL_PUBLIC_URL:-}
      ENROLL_SSH_ENABLED: ${ENROLL_SSH_ENABLED:-false}
      DYGK_CONTROL_SOCKET: /run/openxdr/deception/control.sock
    volumes:
      - ./rules:/rules:ro
      - ./tasks:/tasks:ro
      - ./certs:/certs:ro
      - ./dist:/dist:ro
      - deception-control:/run/openxdr/deception
    ports:
      - "8080:8080"   # REST API
      - "8081:8081"   # gRPC：agent / sensor 接入
    extra_hosts:
      - "host.docker.internal:host-gateway"

  deception:
    profiles: [dygk]
    build:
      context: .
      dockerfile: integrations/dygk/Dockerfile
      args:
        DYGK_SOURCE: ${DYGK_SOURCE:-local}
        DYGK_LOCAL_SOURCE: ${DYGK_LOCAL_SOURCE:-local-source}
      secrets:
        - dygk_upstream_token
    image: openxdr-deception:${DYGK_VERSION:-local}
    depends_on:
      - server
    environment:
      DYGK_CONTROL_SOCKET: /run/openxdr/deception/control.sock
      DYGK_STATE_DIR: /data
      DYGK_LISTEN_HOST: 0.0.0.0
    volumes:
      - deception-control:/run/openxdr/deception
      - deception-data:/data
    ports:
      - "${DYGK_BIND_IP:-127.0.0.1}:${DYGK_PORT_RANGE:-18080-18179}:${DYGK_PORT_RANGE:-18080-18179}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 30s

  web:
    build:
      context: ./web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
  natsdata:
  deception-control:
  deception-data:

secrets:
  dygk_upstream_token:
    environment: DYGK_UPSTREAM_TOKEN
