services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openxdr
      POSTGRES_PASSWORD: openxdr
      POSTGRES_DB: openxdr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openxdr"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openxdr:openxdr@postgres:5432/openxdr?sslmode=disable
      RULES_PATH: /rules
      # AI 研判：留空则不启用。接本地 Ollama 时用 host.docker.internal
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # 首次启动的 admin 密码；不设则随机生成并打印在 server 日志里
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 告警通知：留空不推送。格式 generic / dingtalk / feishu / wecom
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-generic}
      # 消息里控制台链接的前缀，如 http://xdr.internal:5173
      WEBHOOK_LINK_BASE: ${WEBHOOK_LINK_BASE:-}
      # 低于该级别的事件不推送（1~5），0 表示全推
      WEBHOOK_MIN_SEVERITY: ${WEBHOOK_MIN_SEVERITY:-0}
      # syslog 接入：留空不启用，如 ":514"（记得同时映射端口）
      SYSLOG_ADDR: ${SYSLOG_ADDR:-}
      # 响应处置：结束进程 / 主机隔离
      RESPONSE_ENABLED: ${RESPONSE_ENABLED:-false}
      ISOLATION_ALLOW: ${ISOLATION_ALLOW:-}
      # 原始事件保留天数
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - ./rules:/rules:ro
    ports:
      - "8080:8080"   # REST API
      - "8081:8081"   # gRPC：agent / sensor 接入
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./web
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
