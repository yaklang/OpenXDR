name: 独立欺骗引擎发布

on:
  workflow_dispatch:
  push:
    tags: ['dygk-v*']

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: 测试独立原生引擎
        working-directory: server
        run: go test -race ./deception/...
      - name: 构建独立运行包
        working-directory: server
        run: |
          mkdir -p ../engine-dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../engine-dist/decoyhost-linux-amd64 ./deception/cmd/decoyhost
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o ../engine-dist/decoyhost-linux-arm64 ./deception/cmd/decoyhost
          cd ../engine-dist
          sha256sum decoyhost-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: deception-native
          path: engine-dist

  image:
    # 当前上游为 UNLICENSED；确认分发授权后由仓库管理员开启发布。
    if: vars.DYGK_DISTRIBUTION_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像名称
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/$owner/openxdr-deception:$REVISION" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$owner/openxdr-deception:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/dygk/Dockerfile
          build-args: |
            DYGK_SOURCE=${{ vars.DYGK_SOURCE || 'local' }}
            DYGK_LOCAL_SOURCE=${{ vars.DYGK_LOCAL_SOURCE || 'local-source' }}
          platforms: linux/amd64,linux/arm64
          push: true
          secrets: |
            dygk_upstream_token=${{ secrets.DYGK_UPSTREAM_TOKEN }}
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest }}
