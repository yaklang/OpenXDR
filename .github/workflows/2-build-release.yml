name: "2. Build & Release OpenXDR (English Edition)"

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ဥပမာ v2026.11.02-openxdr-en)'
        required: false
  push:
    tags:
      - 'v*-openxdr-en'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: "Build OpenXDR Binaries & Publish Release"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Translated Source"
        uses: actions/checkout@v4
        with:
          ref: 'english-edition'

      - name: "2. Setup Golang 1.23"
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: "3. Build OpenXDR for Windows, Linux, macOS"
        id: pkg
        run: |
          mkdir -p release-assets
          TAG="${{ inputs.tag_name || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ -f "go.mod" ]; then
            go mod tidy || true
            
            # OpenXDR တွင် cmd/ ဖိုင်တွဲခွဲခြားထားပါက ခွဲပြီး Build မည်
            if [ -d "./cmd" ]; then
              for cmd_dir in ./cmd/*; do
                if [ -d "$cmd_dir" ]; then
                  bin_name=$(basename "$cmd_dir")
                  echo "Building $bin_name..."
                  GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release-assets/${bin_name}_linux_amd64" "$cmd_dir" || true
                  GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release-assets/${bin_name}_windows_amd64.exe" "$cmd_dir" || true
                  GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release-assets/${bin_name}_darwin_arm64" "$cmd_dir" || true
                fi
              done
            else
              # Root package ဖြစ်ပါက OpenXDR အမည်ဖြင့် တိုက်ရိုက် Build မည်
              echo "Building root OpenXDR package..."
              GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release-assets/OpenXDR_linux_amd64" . || true
              GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "release-assets/OpenXDR_windows_amd64.exe" . || true
              GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "release-assets/OpenXDR_darwin_arm64" . || true
            fi
          fi
          
          # Source code များကိုပါ Bundle အနေဖြင့် သိမ်းဆည်းပေးမည်
          zip -r "release-assets/OpenXDR-source-en.zip" . -x "*.git*" "release-assets/*"
          ls -lh release-assets/

      - name: "4. Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "OpenXDR English Edition (${{ steps.pkg.outputs.tag }})"
          overwrite: true
          body: |
            ### OpenXDR English Edition — ${{ steps.pkg.outputs.tag }}
            * **100% Translated to English** via Yaklang Ecosystem Automation.
            * Supported Platforms: **Windows (exe), Linux, macOS (arm64)**.
          draft: false
          prerelease: false
          files: release-assets/*
