name: "2. Build & Release OpenXDR (English Edition)"

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (ဥပမာ v2026.11.02-openxdr-en)'
        required: false
  push:
    tags:
      - 'v*-en'
      - 'v*-openxdr-en'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: "Build OpenXDR Binaries & Publish Release"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Translated Source"
        uses: actions/checkout@v4
        with:
          ref: 'english-edition'

      - name: "2. Setup Golang 1.23"
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: "3. Build OpenXDR Server (Go)"
        run: |
          mkdir -p release-assets
          if [ -d "server" ] && [ -f "server/go.mod" ]; then
            echo "Building Go Server..."
            cd server
            go mod tidy || true
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-linux-amd64" . || true
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-windows-amd64.exe" . || true
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "../release-assets/openxdr-server-darwin-arm64" . || true
            cd ..
          fi

      - name: "4. Setup Rust & Cross-Compilation Tools"
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --version 0.10.4 --locked || true

      - name: "5. Build OpenXDR Agent & Sensor (Rust)"
        run: |
          echo "Building Rust Agent..."
          if [ -d "agent" ]; then
            cd agent
            cargo build --release --locked --features ebpf --target x86_64-unknown-linux-musl || cargo build --release --locked --target x86_64-unknown-linux-musl
            cargo build --release --locked --target x86_64-pc-windows-gnu || true
            cd ..
            cp agent/target/x86_64-unknown-linux-musl/release/openxdr-agent release-assets/openxdr-agent-linux-amd64 || true
            cp agent/target/x86_64-pc-windows-gnu/release/openxdr-agent.exe release-assets/openxdr-agent-windows-amd64.exe || true
          fi

          echo "Building Rust Sensor..."
          if [ -d "sensor" ]; then
            cd sensor
            cargo build --release --locked --target x86_64-unknown-linux-musl || true
            cd ..
            cp sensor/target/x86_64-unknown-linux-musl/release/openxdr-sensor release-assets/openxdr-sensor-linux-amd64 || true
          fi

      - name: "6. Package Source Code"
        run: |
          zip -r "release-assets/OpenXDR-source-en.zip" . -x "*.git*" "release-assets/*"
          ls -lh release-assets/

      - name: "7. Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "OpenXDR English Edition (${{ inputs.tag_name || github.ref_name }})"
          overwrite: true
          body: |
            ### OpenXDR English Edition
            * **100% Translated to English** via Yaklang Ecosystem Automation.
            * Includes **Go Server** binaries (Windows `.exe`, Linux, macOS).
            * Includes **Rust Agent & Sensor** binaries (Windows `.exe`, Linux).
          draft: false
          prerelease: false
          files: release-assets/*
