name: "1. Universal Sync & Translate (Ecosystem Assets)"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '၁၀၀% မပြီးသေးလည်း Release အတင်းထုတ်မည်လား? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  TARGET_BRANCH: "english-edition"
  # Core ကြီး (၃) ခုမှ Cache များကို မျှဝေသုံးစွဲမည်
  YAKIT_FORK_REPO: "https://github.com/professoxrmoriarty/yakit.git"
  YAKLANG_FORK_REPO: "https://github.com/professoxrmoriarty/yaklang.git"
  YTRAY_FORK_REPO: "https://github.com/professoxrmoriarty/ytray.git"

jobs:
  sync-translate:
    name: "Sync & Translate (${{ github.event.repository.name }})"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Fork Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "2. Configure Git & Diff Sync from Upstream"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPO_NAME="${{ github.event.repository.name }}"
          UPSTREAM_URL="https://github.com/yaklang/${REPO_NAME}.git"

          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          [ -f ".github/security_glossary.json" ] && cp .github/security_glossary.json /tmp/backup/
          [ -f ".i18n_cache.json" ] && cp .i18n_cache.json /tmp/backup/

          git remote add upstream "${UPSTREAM_URL}" 2>/dev/null || git remote set-url upstream "${UPSTREAM_URL}"
          git fetch upstream main --tags || git fetch upstream master --tags
          UP_REF="upstream/main"
          git rev-parse --verify "$UP_REF" >/dev/null 2>&1 || UP_REF="upstream/master"

          git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || git checkout -B "${{ env.TARGET_BRANCH }}" "$UP_REF"

          if ! git merge "$UP_REF" -X theirs --allow-unrelated-histories --no-edit; then
            git status --porcelain | awk '$1=="DU" || $1=="UD" {print $2}' | xargs -r git rm -f
            git checkout --theirs . || true
            git add -A
            git commit --no-edit || true
          fi

          rm -rf .github/workflows/*
          mkdir -p .github/workflows
          cp /tmp/backup/workflows/1-sync-translate.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/backup/workflows/2-build-release.yml .github/workflows/ 2>/dev/null || true
          [ -f "/tmp/backup/security_glossary.json" ] && cp /tmp/backup/security_glossary.json .github/
          [ -f "/tmp/backup/.i18n_cache.json" ] && cp /tmp/backup/.i18n_cache.json .

          for FORK in "${{ env.YAKIT_FORK_REPO }}" "${{ env.YAKLANG_FORK_REPO }}" "${{ env.YTRAY_FORK_REPO }}"; do
            NAME=$(basename "$FORK" .git)
            git clone --depth 1 --branch english-edition "$FORK" "/tmp/${NAME}_fork" 2>/dev/null || true
            [ -f "/tmp/${NAME}_fork/.i18n_cache.json" ] && cp "/tmp/${NAME}_fork/.i18n_cache.json" "/tmp/${NAME}_cache.json"
            [ ! -f ".github/security_glossary.json" ] && [ -f "/tmp/${NAME}_fork/.github/security_glossary.json" ] && cp "/tmp/${NAME}_fork/.github/security_glossary.json" .github/security_glossary.json
            rm -rf "/tmp/${NAME}_fork"
          done

      - name: "3. Setup Python 3.11 & Libraries"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: "4. Progressive Translation (Markdown, JSON, Code, YAML)"
        id: translate
        run: |
          python3 - << 'EOF'
          import os, re, json, time, yaml
          from deep_translator import GoogleTranslator

          CACHE_FILE = ".i18n_cache.json"
          GLOSSARY_FILE = ".github/security_glossary.json"
          START_TIME = time.time()
          MAX_RUNTIME_SECONDS = 45 * 60
          MAX_CONSECUTIVE_FAILURES = 5

          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          placeholder_re = re.compile(r'(\{\{.*?\}\}|\$\{[^}]+\}|\{\d+\}|%[+#0 -]*\d*(?:\.\d+)?[svTtbcdoqxXUeEfFgGp%]|[nrt"])')
          IGNORE_DIRS = {".git", ".github", "node_modules", "dist", "out", "vendor", "build"}

          def has_zh(text): return bool(zh_char_re.search(str(text)))

          def safe_load_json(filepath):
              if not os.path.exists(filepath): return {}
              try:
                  with open(filepath, 'r', encoding='utf-8') as f: raw = f.read()
                  return json.loads(raw)
              except:
                  try:
                      cleaned = re.sub(r',\s*([}\]])', r'\1', raw)
                      return json.loads(cleaned)
                  except: return {}

          exact_glossary, inline_glossary = {}, {}
          g_data = safe_load_json(GLOSSARY_FILE)
          for _, mapping in g_data.get("terms", {}).items():
              if isinstance(mapping, dict):
                  exact_glossary.update(mapping)
                  inline_glossary.update(mapping)
          sorted_inline_keys = sorted(inline_glossary.keys(), key=len, reverse=True)

          cache = {}
          for cf in ("/tmp/yaklang_cache.json", "/tmp/yakit_cache.json", "/tmp/ytray_cache.json", CACHE_FILE):
              cache.update(safe_load_json(cf))

          def save_cache():
              with open(CACHE_FILE, 'w', encoding='utf-8') as f:
                  json.dump(cache, f, ensure_ascii=False, indent=2)

          def translate_one(orig):
              stripped = orig.strip()
              if stripped in exact_glossary: return exact_glossary[stripped]
              tokens = []
              def mask_fn(m):
                  tokens.append(m.group(0))
                  return f"__PH{len(tokens)-1}__"
              masked = placeholder_re.sub(mask_fn, orig)
              for zh_k in sorted_inline_keys:
                  if zh_k in masked: masked = masked.replace(zh_k, f" {inline_glossary[zh_k]} ")
              if has_zh(masked): masked = translator.translate(masked) or masked
              for idx, tok in enumerate(tokens):
                  masked = re.sub(rf'__PH{idx}__', lambda _: tok, masked, flags=re.IGNORECASE)
              return re.sub(r' {2,}', ' ', masked).strip()

          zh_strings = set()
          files_to_process = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS]
              for file in files:
                  p = os.path.join(root, file)
                  if file.endswith(('.go', '.ts', '.py', '.json', '.yaml', '.yml', '.md', '.txt', '.csv')):
                      try:
                          with open(p, 'r', encoding='utf-8') as f: c = f.read()
                          if has_zh(c):
                              files_to_process.append((p, c))
                              if file.endswith('.md') or file.endswith('.txt'):
                                  for ln in c.splitlines():
                                      if has_zh(ln) and not ln.strip().startswith("```") and len(ln) <= 500:
                                          zh_strings.add(ln.strip())
                              else:
                                  for m in re.finditer(r'("(?:\\.|[^"\\\n])*")|(\'[^\'\n]*\')', c):
                                      inner = m.group(0)[1:-1]
                                      if has_zh(inner) and len(inner) <= 500: zh_strings.add(inner)
                      except: pass

          uncached = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          print(f"Total Strings: {len(zh_strings)} | Uncached: {len(uncached)}")

          limit_reached, failures = False, 0
          for idx, s in enumerate(uncached):
              if time.time() - START_TIME > MAX_RUNTIME_SECONDS or failures >= MAX_CONSECUTIVE_FAILURES:
                  limit_reached = True; break
              try:
                  res = translate_one(s)
                  if res and not has_zh(res): cache[s] = res; failures = 0
                  else: failures += 1
              except: failures += 1; time.sleep(1.5)
              if (idx + 1) % 30 == 0: save_cache(); time.sleep(0.4)
          save_cache()

          for p, c in files_to_process:
              try:
                  if p.endswith('.md') or p.endswith('.txt'):
                      out = []
                      for ln in c.splitlines():
                          st = ln.strip()
                          out.append(ln.replace(st, cache[st], 1) if st in cache and not has_zh(cache[st]) else ln)
                      nc = "\n".join(out) + "\n"
                  else:
                      def repl(m):
                          q, inner = m.group(0)[0], m.group(0)[1:-1]
                          if inner in cache and not has_zh(cache[inner]):
                              return f"{q}{cache[inner].replace(q, '/'+q)}{q}"
                          return m.group(0)
                      nc = re.sub(r'("(?:\\.|[^"\\\n])*")|(\'[^\'\n]*\')', repl, c)
                  if nc != c:
                      with open(p, 'w', encoding='utf-8') as f: f.write(nc)
              except: pass

          remaining = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          is_complete = (len(remaining) == 0) and not limit_reached
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_complete={'true' if is_complete else 'false'}\n")
              f.write(f"remaining_count={len(remaining)}\n")
          EOF

      - name: "5. Commit & Trigger Build"
        run: |
          git add -f .i18n_cache.json .github/ 2>/dev/null || true
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.translate.outputs.is_complete }}" == "true" ]; then
              git commit -m "feat(i18n): 100% translated to English"
            else
              git commit -m "chore(i18n): save translation progress (${{ steps.translate.outputs.remaining_count }} left) [skip ci]"
            fi
            git push origin HEAD:refs/heads/${{ env.TARGET_BRANCH }} --force
          fi
          if [ "${{ steps.translate.outputs.is_complete }}" == "true" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            EN_TAG="v$(date +'%Y.%m.%d')-en"
            git tag -f "${EN_TAG}" HEAD
            git push origin "refs/tags/${EN_TAG}" --force
            gh workflow run 2-build-release.yml --ref "${{ env.TARGET_BRANCH }}" -f tag_name="${EN_TAG}" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
