name: Release

# 推 v* 标签即发版：编 agent / sensor（Linux amd64 + arm64、Windows）→ 把 agent 与 sensor 安装包打进 server 镜像、推 GHCR（amd64 + arm64）→ 建 GitHub Release。
# Release 附件：install.sh（一行安装）、docker-compose.yml、各平台安装包与 SHA256SUMS。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 标签与属主经环境变量进 shell，不直接拼进脚本
env:
  TAG: ${{ github.ref_name }}
  OWNER: ${{ github.repository_owner }}

jobs:
  binaries:
    name: 采集端安装包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # musl 静态链接：一个二进制跑遍新老发行版（CentOS 7 也行）；mingw 给 Windows 目标
      - name: 安装交叉编译工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - name: 安装 nightly 与 bpf-linker
        # pin 0.10.4 的原因见 ci.yml
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --version 0.10.4 --locked
      - name: agent（Linux，带 eBPF）
        working-directory: agent
        # 默认构建没有 Linux 网络采集，分发包必须是 eBPF 构建；拿不到 eBPF 时它自己退到 netlink / 轮询
        run: |
          cargo build --release --locked --features ebpf --target x86_64-unknown-linux-musl
          strings target/x86_64-unknown-linux-musl/release/openxdr-agent | grep -c inet_sock_set_state
      - name: agent（Windows）
        working-directory: agent
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: sensor（Linux）
        working-directory: sensor
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: 整理
        run: |
          mkdir -p out/dist
          cp agent/target/x86_64-unknown-linux-musl/release/openxdr-agent out/dist/openxdr-agent-linux-amd64
          cp agent/target/x86_64-pc-windows-gnu/release/openxdr-agent.exe out/dist/openxdr-agent-windows-amd64.exe
          # sensor 与 agent 同目录：一行安装从这里下载，在线探针按这里的哈希自动升级
          cp sensor/target/x86_64-unknown-linux-musl/release/openxdr-sensor out/dist/openxdr-sensor-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: out

  # arm64 用 GitHub 原生 arm runner 本机编译，与 x86_64 作业并行：不用交叉工具链，
  # ring 的 C 代码由 musl-tools 的 musl-gcc 编，eBPF 的 bpf_target_arch 取本机架构，编完还能直接跑一下
  binaries-arm64:
    name: 采集端安装包（arm64）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      # file / strings 用于产物检查，arm runner 镜像比 x86 精简，显式装上
      - name: 安装 musl 工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools file binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: 安装 nightly 与 bpf-linker
        # pin 0.10.4 的原因见 ci.yml
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install bpf-linker --version 0.10.4 --locked
      - name: agent（Linux arm64，带 eBPF）
        working-directory: agent
        run: |
          cargo build --release --locked --features ebpf --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/openxdr-agent
          # grep 读完整个输入再退出：-q 提前退出会让 strings 吃 SIGPIPE，pipefail 下误判失败
          strings "$bin" | grep -c inet_sock_set_state
          file "$bin" | grep 'ARM aarch64.*static'
          "$bin" version
      - name: sensor（Linux arm64）
        working-directory: sensor
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/openxdr-sensor
          file "$bin" | grep 'ARM aarch64.*static'
          "$bin" version
      - name: 整理
        run: |
          mkdir -p out/dist
          cp agent/target/aarch64-unknown-linux-musl/release/openxdr-agent out/dist/openxdr-agent-linux-arm64
          cp sensor/target/aarch64-unknown-linux-musl/release/openxdr-sensor out/dist/openxdr-sensor-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-arm64
          path: out

  images:
    name: 容器镜像
    needs: [binaries, binaries-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # 两个架构的安装包合进同一个 out/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: out
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: 离线 IP 归属库
        # DB-IP Lite（CC BY 4.0）当月版本打进镜像，下载后做结构与类型校验；DB-IP 只保留最近两个月、不发布校验和，
        # 没法钉固定版本的 SHA256，这里把实际打进去的哈希记进日志和镜像。下载或校验失败直接让发版失败，不发缺库的镜像
        working-directory: server
        run: |
          go run ./cmd/ipdb -dir ../ipdb-out/ipdb
          cd ../ipdb-out/ipdb && sha256sum -- *.mmdb | tee SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 标签
        id: tags
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$TAG
          for img in server web; do
            list="ghcr.io/$owner/openxdr-$img:$tag"
            # 预发布版（带 -）不动 latest
            case $tag in *-*) ;; *) list="$list,ghcr.io/$owner/openxdr-$img:latest" ;; esac
            echo "$img=$list" >> "$GITHUB_OUTPUT"
          done
      - name: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # 把 agent 与 sensor 安装包打进镜像：升级镜像，在线 agent 与探针跟着自动升级；离线 IP 归属库随镜像带一份
          build-contexts: |
            agents=out
            ipdb=ipdb-out
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.web }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # 两个架构的安装包合进同一个 out/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: out
      - name: 附件
        run: |
          tag=$TAG
          mkdir assets
          cp out/dist/* assets/
          # 安装脚本钉住本版本：用户拿到的哪个 Release 的脚本，就装哪个版本
          sed "s/__OPENXDR_VERSION__/$tag/" deploy/install/install.sh > assets/install.sh
          cp deploy/install/docker-compose.yml deploy/install/docker-compose.syslog.yml deploy/nats.conf assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: 说明
        run: |
          tag=$TAG
          ver=${tag#v}
          {
            sed "s/__OPENXDR_VERSION__/$tag/g" deploy/install/RELEASE_NOTES.md
            echo
            # 本版本的变更记录：CHANGELOG 里 ## [版本] 到下一个 ## [ 之间
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md
          } > notes.md
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$TAG
          pre=""; case $tag in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --title "OpenXDR $tag" --notes-file notes.md $pre assets/*
