name: Release

# 推 v* 标签即发版：编 agent / sensor（Linux amd64 + arm64、Windows）、离线 IP 库与 web 镜像并行 →
# 原生双架构（amd64 + arm64，免 QEMU）各自构建 server 镜像并按 digest 推 GHCR → 合并多架构 manifest → 建 GitHub Release。
# Release 附件：install.sh（一行安装）、docker-compose.yml、各平台安装包与 SHA256SUMS。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 标签与属主经环境变量进 shell，不直接拼进脚本
env:
  TAG: ${{ github.ref_name }}
  OWNER: ${{ github.repository_owner }}

jobs:
  binaries-agent:
    name: agent 安装包 (amd64/Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # musl 静态链接：一个二进制跑遍新老发行版（CentOS 7 也行）；mingw 给 Windows 目标
      - name: 安装交叉编译工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - name: 安装 nightly 与 rust-src
        run: rustup toolchain install nightly --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: release-amd64
      - name: 缓存 bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-0.10.4-${{ runner.os }}-${{ runner.arch }}
      - name: 安装 bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        # pin 0.10.4 的原因见 ci.yml
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: agent（Linux，带 eBPF）
        working-directory: agent
        # 默认构建没有 Linux 网络采集，分发包必须是 eBPF 构建；拿不到 eBPF 时它自己退到 netlink / 轮询
        run: |
          cargo build --release --locked --features ebpf,execblock --target x86_64-unknown-linux-musl
          strings target/x86_64-unknown-linux-musl/release/openxdr-agent | grep -c inet_sock_set_state
      - name: agent（Windows）
        working-directory: agent
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: 整理
        run: |
          mkdir -p out/dist
          cp agent/target/x86_64-unknown-linux-musl/release/openxdr-agent out/dist/openxdr-agent-linux-amd64
          cp agent/target/x86_64-pc-windows-gnu/release/openxdr-agent.exe out/dist/openxdr-agent-windows-amd64.exe
          # 托盘与 agent 同一个 crate、同一次构建产出；安装脚本顺带下载，不随 agent 自动升级
          cp agent/target/x86_64-unknown-linux-musl/release/openxdr-tray out/dist/openxdr-tray-linux-amd64
          cp agent/target/x86_64-pc-windows-gnu/release/openxdr-tray.exe out/dist/openxdr-tray-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-agent
          path: out

  binaries-sensor:
    name: sensor 安装包 (amd64/Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: 安装交叉编译工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sensor
          key: release-amd64
      - name: sensor（Linux）
        working-directory: sensor
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: sensor（Windows）
        working-directory: sensor
        run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - name: 整理
        run: |
          mkdir -p out/dist
          # sensor 与 agent 同目录：一行安装从这里下载，在线探针按这里的哈希自动升级
          cp sensor/target/x86_64-unknown-linux-musl/release/openxdr-sensor out/dist/openxdr-sensor-linux-amd64
          cp sensor/target/x86_64-pc-windows-gnu/release/openxdr-sensor.exe out/dist/openxdr-sensor-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-sensor
          path: out

  # arm64 用 GitHub 原生 arm runner 本机编译，与 x86_64 作业并行：不用交叉工具链，
  # ring 的 C 代码由 musl-tools 的 musl-gcc 编，eBPF 的 bpf_target_arch 取本机架构，编完还能直接跑一下
  binaries-arm64:
    name: 采集端安装包（arm64）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # file / strings 用于产物检查，arm runner 镜像比 x86 精简，显式装上
      - name: 安装 musl 工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang file binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: 安装 nightly 与 rust-src
        run: rustup toolchain install nightly --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            sensor
          key: release-arm64
      - name: 缓存 bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-0.10.4-${{ runner.os }}-${{ runner.arch }}
      - name: 安装 bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        # pin 0.10.4 的原因见 ci.yml
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: agent（Linux arm64，带 eBPF）
        working-directory: agent
        run: |
          cargo build --release --locked --features ebpf,execblock --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/openxdr-agent
          # grep 读完整个输入再退出：-q 提前退出会让 strings 吃 SIGPIPE，pipefail 下误判失败
          strings "$bin" | grep -c inet_sock_set_state
          file "$bin" | grep 'ARM aarch64.*static'
          "$bin" version
      - name: sensor（Linux arm64）
        working-directory: sensor
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/openxdr-sensor
          file "$bin" | grep 'ARM aarch64.*static'
          "$bin" version
      - name: 整理
        run: |
          mkdir -p out/dist
          cp agent/target/aarch64-unknown-linux-musl/release/openxdr-agent out/dist/openxdr-agent-linux-arm64
          cp agent/target/aarch64-unknown-linux-musl/release/openxdr-tray out/dist/openxdr-tray-linux-arm64
          cp sensor/target/aarch64-unknown-linux-musl/release/openxdr-sensor out/dist/openxdr-sensor-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-arm64
          path: out

  # 离线 IP 归属库只拉取校验一次，供 amd64 / arm64 镜像共享，确保双架构内置的库完全一致
  ipdb:
    name: 离线 IP 归属库
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: 下载并校验 DB-IP Lite
        # DB-IP Lite（CC BY 4.0）当月版本打进镜像，下载后做结构与类型校验；DB-IP 只保留最近两个月、不发布校验和，
        # 没法钉固定版本的 SHA256，这里把实际打进去的哈希记进日志和镜像。下载或校验失败直接让发版失败，不发缺库的镜像
        working-directory: server
        run: |
          go run ./cmd/ipdb -dir ../ipdb-out/ipdb
          cd ../ipdb-out/ipdb && sha256sum -- *.mmdb | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ipdb
          path: ipdb-out

  # web 镜像不依赖采集端安装包，且最终镜像无 RUN 步骤（无需 QEMU），与 binaries 并行构建
  image-web:
    name: 容器镜像 (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 标签
        id: tags
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$TAG
          list="ghcr.io/$owner/openxdr-web:$tag"
          # 预发布版（带 -）不动 latest
          case $tag in *-*) ;; *) list="$list,ghcr.io/$owner/openxdr-web:latest" ;; esac
          echo "web=$list" >> "$GITHUB_OUTPUT"
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.web }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web

  # 原生双架构各自构建 server 镜像并按 digest 推送，避免 arm64 在 QEMU 下跑 apk add chromium
  image-server:
    name: 容器镜像 (server ${{ matrix.arch }})
    needs: [binaries-agent, binaries-sensor, binaries-arm64, ipdb]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      # 三个安装包产物合进同一个 out/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ipdb
          path: ipdb-out
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像仓库名
        id: repo
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/openxdr-server" >> "$GITHUB_OUTPUT"
      - name: server (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # 把 agent 与 sensor 安装包打进镜像：升级镜像，在线 agent 与探针跟着自动升级；离线 IP 归属库随镜像带一份
          build-contexts: |
            agents=out
            ipdb=ipdb-out
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-server-${{ matrix.arch }}
      - name: 导出 digest
        run: |
          mkdir -p digests
          printf '%s' "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: digests

  images:
    name: 合并 server 多架构镜像
    needs: [image-server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 合并并打标签
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$TAG
          repo="ghcr.io/$owner/openxdr-server"
          args=(-t "$repo:$tag")
          # 预发布版（带 -）不动 latest
          case $tag in *-*) ;; *) args+=(-t "$repo:latest") ;; esac
          for f in digests/*; do
            args+=("$repo@$(cat "$f")")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$repo:$tag"

  release:
    name: GitHub Release
    needs: [images, image-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # 三个安装包产物合进同一个 out/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries*
          merge-multiple: true
          path: out
      - name: 附件
        run: |
          tag=$TAG
          mkdir assets
          cp out/dist/* assets/
          # 安装脚本钉住本版本：用户拿到的哪个 Release 的脚本，就装哪个版本
          sed "s/__OPENXDR_VERSION__/$tag/" deploy/install/install.sh > assets/install.sh
          cp deploy/install/docker-compose.yml deploy/install/docker-compose.syslog.yml deploy/nats.conf assets/
          (cd assets && sha256sum -- * > SHA256SUMS)
      - name: 说明
        run: |
          tag=$TAG
          ver=${tag#v}
          {
            sed "s/__OPENXDR_VERSION__/$tag/g" deploy/install/RELEASE_NOTES.md
            echo
            # 本版本的变更记录：CHANGELOG 里 ## [版本] 到下一个 ## [ 之间
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md
          } > notes.md
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$TAG
          pre=""; case $tag in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --title "OpenXDR $tag" --notes-file notes.md $pre assets/*
