name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新推送取消旧运行，别让排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Go 单元测试)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: 格式检查
        working-directory: server
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 日志归档回归
        run: python3 -m unittest discover -s deploy/ha/logs -p 'test_*.py'
      - name: 构建
        working-directory: server
        run: go build ./...
      - name: 静态检查
        working-directory: server
        run: go vet ./...
      - name: 测试
        working-directory: server
        run: go test -race ./...
      - name: 自带规则必须全部可加载
        working-directory: server
        run: go run ./cmd/sigmacheck --strict ../rules
      # 检测能力回归线：规则改动后真实攻击命令还能不能抓住
      - name: 检测验证对拍
        working-directory: server
        run: go run ./cmd/detectcheck --strict

  server-integration:
    name: Server (Go 集成测试)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openxdr
          POSTGRES_PASSWORD: openxdr
          POSTGRES_DB: openxdr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 按配置准备 DYGK 运行依赖
        id: dygk_source
        working-directory: integrations/dygk
        run: node scripts/prepare-upstream.mjs --ci
        env:
          DYGK_SOURCE: ${{ vars.DYGK_SOURCE }}
          DYGK_LOCAL_SOURCE: ${{ vars.DYGK_LOCAL_SOURCE }}
          DYGK_UPSTREAM_TOKEN: ${{ secrets.DYGK_UPSTREAM_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: 构建真实沙箱契约测试镜像
        uses: docker/build-push-action@v6
        with:
          context: deploy/pi-sandbox
          load: true
          tags: openxdr-pi-sandbox:ci
          build-args: NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=pi-sandbox
          cache-to: type=gha,mode=max,scope=pi-sandbox
      # 测试库不需要崩溃安全：关掉落盘保证，并行跑时数据库不再是瓶颈（三项都可在线生效）
      - name: 测试库关闭落盘保证
        run: psql "$INTEGRATION_DATABASE_URL" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
        env:
          INTEGRATION_DATABASE_URL: postgres://openxdr:openxdr@localhost:5432/openxdr_test?sslmode=disable
      # 每个包用独立测试库并行跑；并行时失败的包串行重跑一次，仍失败才算失败
      - name: 集成测试
        working-directory: server
        run: sh integration-test.sh
        env:
          INTEGRATION_DATABASE_URL: postgres://openxdr:openxdr@localhost:5432/openxdr_test?sslmode=disable
          OPENXDR_SANDBOX_TEST_IMAGE: openxdr-pi-sandbox:ci
          DECEPTION_NODE: ${{ steps.dygk_source.outputs.available == 'true' && 'node' || '' }}

  deception-runtime:
    name: 独立欺骗引擎
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DYGK_SOURCE: ${{ vars.DYGK_SOURCE }}
      DYGK_LOCAL_SOURCE: ${{ vars.DYGK_LOCAL_SOURCE }}
      DYGK_UPSTREAM_TOKEN: ${{ secrets.DYGK_UPSTREAM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - working-directory: integrations/dygk
        run: npm test
      - working-directory: integrations/dygk
        id: dygk_source
        run: node scripts/prepare-upstream.mjs --ci
      - working-directory: integrations/dygk
        if: steps.dygk_source.outputs.available == 'true'
        run: npm run test:upstream
      - working-directory: integrations/dygk
        if: steps.dygk_source.outputs.available == 'true'
        run: node scripts/stage-runtime.mjs "$RUNNER_TEMP/deception-runtime"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: go test -race ./deception/... ./internal/decoy
      - name: 验证主编排与独立镜像
        if: steps.dygk_source.outputs.available == 'true'
        run: |
          docker compose --profile dygk config --quiet
          docker build --build-arg DYGK_SOURCE="${DYGK_SOURCE:-local}" --build-arg DYGK_LOCAL_SOURCE="${DYGK_LOCAL_SOURCE:-local-source}" --secret id=dygk_upstream_token,env=DYGK_UPSTREAM_TOKEN -f integrations/dygk/Dockerfile -t openxdr-deception:ci .
          docker run --rm --entrypoint node openxdr-deception:ci web/main.mjs --print-release
          docker run --rm --entrypoint decoyhost openxdr-deception:ci -print-release

  pi-runtime:
    name: Pi runtime (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/pi-runtime/package-lock.json
      - working-directory: server/pi-runtime
        run: npm ci --ignore-scripts
      - working-directory: server/pi-runtime
        run: npm test

      - name: Sandbox CLI contract
        run: node --test deploy/pi-sandbox/xdr.test.mjs

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build

  pages:
    name: Pages (项目主页)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - working-directory: pages
        run: npm ci
      - working-directory: pages
        run: npm run build

  # 默认构建不需要 nightly 和 bpf-linker，这一项守住"开箱即用"
  collectors:
    name: ${{ matrix.crate }} (默认特性)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [agent, sensor]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: 格式检查
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check
      - name: 构建
        working-directory: ${{ matrix.crate }}
        run: cargo build --locked
      - name: 静态检查
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        working-directory: ${{ matrix.crate }}
        run: cargo test

  # 发版有 arm64 安装包：原生 arm runner 上编译与跑测试，守住 arm64 不回归（c_char 符号、结构体布局等）
  collectors-arm64:
    name: ${{ matrix.crate }} (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate: [agent, sensor]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: 构建
        working-directory: ${{ matrix.crate }}
        run: cargo build --locked
      - name: 静态检查
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        working-directory: ${{ matrix.crate }}
        run: cargo test

  # 内核采集是可选特性，单独一项：它需要 nightly 工具链和 bpf-linker
  kernel-collectors:
    name: ${{ matrix.crate }} (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: agent
            feature: ebpf,execblock
          - crate: sensor
            feature: xdp
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 nightly 与 rust-src
        run: rustup toolchain install nightly --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          key: ${{ matrix.feature }}
      - name: 安装 BPF Clang
        if: matrix.crate == 'agent'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: 缓存 bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-0.10.4-${{ runner.os }}-${{ runner.arch }}
      - name: 安装 bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        # pin 版本：0.10.4 默认用 nightly 自带 LLVM（rust-llvm-22），不依赖 runner 预装 LLVM。
        # 0.11 起默认改为 llvm-23，cargo install 不 pin 会被悄悄拉新打断构建。
        run: cargo install bpf-linker --version 0.10.4 --locked
      - name: 构建
        working-directory: ${{ matrix.crate }}
        run: cargo build --features ${{ matrix.feature }}
      - name: 执行拦截状态测试
        if: matrix.crate == 'agent'
        working-directory: agent
        run: cargo test --locked --features execblock execblock_linux

  # 采集端要能交叉编译到 Windows：ETW 与 Packet Monitor 代码平时在 Linux CI 上编不到
  windows-target:
    name: Collectors (Windows 目标)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # ring 的构建脚本要 mingw 交叉编译器
      - name: 安装 mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent
            sensor
          key: windows
      - working-directory: agent
        run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      # Windows 版 sensor（Packet Monitor 后端）
      - working-directory: sensor
        run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  images:
    name: 容器镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: 构建 server 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: openxdr-server:ci
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server
      - name: 构建 web 镜像
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: openxdr-web:ci
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web
