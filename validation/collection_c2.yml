technique: T1560.001
name: Archive Collected Data
cases:
  - name: tar 打包家目录
    source: atomic T1560.001
    class: 1007
    os: linux
    event:
      process:
        name: tar
        cmd_line: "tar czf /tmp/loot.tar.gz /home/alice"

  - name: zip 打包 /etc
    source: atomic T1560.001
    class: 1007
    os: linux
    event:
      process:
        name: zip
        cmd_line: "zip -r /tmp/etc.zip /etc"

  - name: 打包 SSH 私钥
    source: atomic T1560.001
    class: 1007
    os: linux
    event:
      process:
        name: tar
        cmd_line: "tar cvf /tmp/keys.tar /root/.ssh"

  - name: 打包临时构建产物（良性对照）
    source: 良性对照
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: tar
        cmd_line: "tar czf /tmp/build.tar.gz /opt/build/output"

  - name: DNS 查询隧道服务
    technique: T1071.004
    source: atomic T1071.004
    class: 4003
    os: linux
    event:
      query:
        hostname: "tunnel.ngrok.io"

  - name: C2 常用高危端口外连
    technique: T1571
    source: atomic T1571
    class: 4001
    event:
      dst_endpoint:
        ip: "10.0.0.1"
        port: 4444

  - name: 自签证书 TLS 会话
    technique: T1573.002
    source: 合成（sensor 证书元数据）
    class: 4001
    event:
      dst_endpoint:
        ip: "203.0.113.9"
        port: 443
      tls:
        sni: "cdn-sync.example"
        cert:
          subject: "cdn-sync.example"
          issuer: "cdn-sync.example"
          self_signed: true

  - name: CA 签发证书（良性对照）
    technique: T1573.002
    source: 良性对照
    class: 4001
    expect: undetected
    event:
      dst_endpoint:
        ip: "93.184.216.34"
        port: 443
      tls:
        sni: "example.com"
        cert:
          subject: "example.com"
          issuer: "DigiCert TLS RSA SHA256 2020 CA1"
          self_signed: false
