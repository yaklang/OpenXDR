technique: T1003.001
name: LSASS Memory Dump
cases:
  - name: comsvcs.dll MiniDump 转储 lsass
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: rundll32.exe
        file:
          path: "C:\\Windows\\System32\\rundll32.exe"
        cmd_line: "rundll32.exe C:\\windows\\system32\\comsvcs.dll, MiniDump 672 C:\\Windows\\Temp\\lsass.dmp full"

  - name: procdump 转储 lsass
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: procdump.exe
        file:
          path: "C:\\Tools\\procdump.exe"
        cmd_line: "procdump.exe -accepteula -ma lsass.exe C:\\Windows\\Temp\\lsass.dmp"

  - name: taskmgr 之外的 lsass 访问（命令行含 lsass）
    source: atomic T1003.001
    class: 1007
    os: windows
    event:
      process:
        name: cmd.exe
        file:
          path: "C:\\Windows\\System32\\cmd.exe"
        cmd_line: "cmd.exe /c tasklist | findstr lsass"
    expect: undetected

  - name: Linux 读取 shadow 文件
    technique: T1003.008
    source: atomic T1003.008
    class: 1007
    os: linux
    event:
      process:
        name: cat
        cmd_line: "cat /etc/shadow"
