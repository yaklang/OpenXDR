technique: T1098.004
name: SSH Authorized Keys
cases:
  - name: 追加公钥到 authorized_keys
    source: atomic T1098.004
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "echo 'ssh-rsa AAAAB3NzaC1yc2EAAAA attacker' >> /root/.ssh/authorized_keys"

  - name: tee -a 写入 authorized_keys
    source: atomic T1098.004
    class: 1007
    os: linux
    event:
      process:
        name: tee
        cmd_line: "echo 'ssh-rsa AAAA' | tee -a /home/user/.ssh/authorized_keys"

  - name: authorized_keys 文件被改动（文件视角）
    source: atomic T1098.004
    class: 1001
    os: linux
    event:
      activity_id: 3
      file:
        path: "/root/.ssh/authorized_keys"

  - name: cron 目录落新任务
    technique: T1053.003
    source: atomic T1053.003
    class: 1001
    os: linux
    event:
      activity_id: 1
      file:
        path: "/etc/cron.d/atomic-persist"

  - name: ld.so.preload 劫持
    technique: T1574.006
    source: atomic T1574.006
    class: 1001
    os: linux
    event:
      activity_id: 3
      file:
        path: "/etc/ld.so.preload"

  - name: systemd 服务落盘
    technique: T1543.002
    source: atomic T1543.002
    class: 1001
    os: linux
    event:
      activity_id: 1
      file:
        path: "/etc/systemd/system/atomic.service"

  - name: systemd 单元文件被修改
    technique: T1543.002
    source: atomic T1543.002
    class: 1001
    os: linux
    event:
      activity_id: 3
      file:
        path: "/etc/systemd/system/atomic.service"

  - name: systemd 单元文件删除（落盘规则只报增/改）
    technique: T1543.002
    source: activity 过滤对照
    class: 1001
    os: linux
    expect: undetected
    event:
      activity_id: 4
      file:
        path: "/etc/systemd/system/atomic.service"

  - name: at 任务落盘
    technique: T1053.001
    source: atomic T1053.001
    class: 1001
    os: linux
    event:
      activity_id: 1
      file:
        path: "/var/spool/at/a0000b0123abcd"

  - name: .bashrc 追加持久化命令
    technique: T1546.004
    source: atomic T1546.004
    class: 1001
    os: linux
    event:
      activity_id: 3
      file:
        path: "/home/user/.bashrc"

  - name: /etc/profile 写入全局持久化
    technique: T1546.004
    source: atomic T1546.004
    class: 1001
    os: linux
    event:
      activity_id: 3
      file:
        path: "/etc/profile"

  - name: 恶意内核模块加载（路径已解析）
    technique: T1547.006
    source: rootkit 通用手法（insmod）
    class: 1005
    os: linux
    event:
      activity_id: 1
      module:
        file:
          path: "/lib/modules/6.8.0-49-generic/kernel/drivers/net/diamorphine.ko"
          name: "diamorphine.ko"

  - name: 恶意内核模块加载（out-of-tree，只报名字）
    technique: T1547.006
    source: rootkit 通用手法（insmod 后源文件已删）
    class: 1005
    os: linux
    event:
      activity_id: 1
      module:
        file:
          name: "diamorphine"

  - name: 内核模块卸载（rootkit 收摊）
    technique: T1547.006
    source: rmmod 对照
    class: 1005
    os: linux
    event:
      activity_id: 4
      module:
        file:
          name: "diamorphine"
