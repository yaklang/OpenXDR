technique: T1082
name: Built-in Benign Chains Counterfactual Corpus
cases:
  # 1. apt 每日更新校验 docker 源签名：apt.systemd.daily → apt-get update → gpgv → apt-key verify → base64 -d
  - name: 良性链：apt.systemd.daily 经 gpgv/apt-key 调 base64 -d 放行
    technique: T1027
    source: prod apt-gpgv-docker-verify
    class: 1007
    os: linux
    event:
      activity_id: 1
      process:
        name: base64
        file:
          path: /usr/bin/base64
        cmd_line: "/usr/bin/base64 -d"
        parent_process:
          name: sh
          file:
            path: /bin/dash
          cmd_line: "/bin/sh /usr/bin/apt-key --quiet --readonly --keyring /etc/apt/keyrings/docker.gpg verify /tmp/apt.sig.9a12 /tmp/apt.data.9a12"
    ancestors:
      - name: gpgv
        file:
          path: /usr/lib/apt/methods/gpgv
        cmd_line: /usr/lib/apt/methods/gpgv
      - name: apt-get
        file:
          path: /usr/bin/apt-get
        cmd_line: "apt-get -y -o APT::Status-Fd=2 update"
      - name: apt.systemd.daily
        file:
          path: /bin/dash
        cmd_line: "/bin/sh /usr/lib/apt/apt.systemd.daily update"
    expect: undetected

  - name: 仿冒链：缺少 gpgv/apt.systemd.daily 祖先的 apt-key 伪装 base64 -d 告警
    technique: T1027
    source: counterfactual apt-gpgv-docker-verify
    class: 1007
    os: linux
    event:
      activity_id: 1
      process:
        name: base64
        file:
          path: /usr/bin/base64
        cmd_line: "/usr/bin/base64 -d"
        parent_process:
          name: sh
          file:
            path: /bin/dash
          cmd_line: "/bin/sh /usr/bin/apt-key verify /tmp/payload.sig /tmp/payload"
    ancestors:
      - name: bash
        file:
          path: /bin/bash
        cmd_line: "-bash"
    expect: detected

