    ancestors:
      - name: bash
        file:
          path: /bin/bash
        cmd_line: "/bin/bash"
    expect: detected

  # 5. GitHub Actions runner：Runner.Listener → Runner.Worker spawnclient → bash -e …/_work/_temp/*.sh 下的子孙进程
  - name: 良性链：GitHub Actions Runner 步骤下执行 cargo 与 docker run 测试容器放行
    technique: UEBA-NEW-PROCESS
    new_process: true
    source: prod github-actions-runner-build
    class: 1007
    os: linux
    event:
      activity_id: 1
      process:
        name: docker
        file:
          path: /usr/bin/docker
        cmd_line: "/usr/bin/docker run --rm -d -p 55432:5432 -e POSTGRES_PASSWORD=test postgres:16-alpine"
        parent_process:
          name: bash
          file:
            path: /usr/bin/bash
          cmd_line: "/usr/bin/bash --noprofile --norc -e -o pipefail /home/runner/actions-runner/_work/_temp/4f8a9c12-11ab.sh"
    ancestors:
      - name: Runner.Worker
        file:
          path: /home/runner/actions-runner/bin/Runner.Worker
        cmd_line: "/home/runner/actions-runner/bin/Runner.Worker spawnclient 142 145"
      - name: Runner.Listener
        file:
          path: /home/runner/actions-runner/bin/Runner.Listener
        cmd_line: "/home/runner/actions-runner/bin/Runner.Listener run"
    expect: undetected

  - name: 仿冒链：伪造 _work/_temp 脚本名但无 Runner.Worker/Listener 祖先告警
