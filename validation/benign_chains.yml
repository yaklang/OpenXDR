    event:
      activity_id: 1
      process:
        name: cc
        file:
          path: /usr/bin/cc
        cmd_line: "cc -m64 /opt/scutum-runner-backend/_work/Scutum/Scutum/target/debug/deps/scutum-1a2b.o /opt/scutum-runner-backend/_work/Scutum/Scutum/target/debug/deps/libwhoami-9f8e.rlib -o /opt/scutum-runner-backend/_work/Scutum/Scutum/target/debug/deps/scutum-1a2b"
