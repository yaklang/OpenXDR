    class: 1007
    os: linux
    event:
      activity_id: 1
      process:
        name: newuidmap
        file:
          path: /usr/bin/newuidmap
        cmd_line: "/usr/bin/newuidmap 48210 0 100000 65536"
        parent_process:
          name: lxc-usernsexec
          file:
            path: /usr/bin/lxc-usernsexec
          cmd_line: "/usr/bin/lxc-usernsexec -m u:0:100000:65536 -m g:0:100000:65536 -- tar cpf - /mnt/vzsnap0"
    ancestors:
      - name: proxmox-backup-client
        file:
          path: /usr/bin/proxmox-backup-client
        cmd_line: "/usr/bin/proxmox-backup-client backup root.pxar:/mnt/vzsnap0 --repository pbs@pam@10.1.1.50:datastore1"
      - name: pvescheduler
        file:
          path: /usr/bin/perl
        cmd_line: "pvescheduler"
    expect: undetected

  - name: 仿冒链：普通会话调 lxc-usernsexec 拉起 newuidmap 缺备份祖先告警
    technique: UEBA-NEW-PROCESS
