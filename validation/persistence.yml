technique: T1547.001
name: Registry Run Keys / Startup Folder
cases:
  - name: 注册表 Run 键新增值（采集端 diff 出的注册表事件）
    source: atomic T1547.001
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\Atomic"
      reg_value:
        data: "C:\\Users\\Public\\evil.exe"

  - name: Winlogon Shell 劫持
    technique: T1547.004
    source: atomic T1547.004
    class: 201002
    os: windows
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Shell"
      reg_value:
        data: "explorer.exe, C:\\evil.exe"

  - name: reg.exe 命令行写 Run 键（进程视角）
    source: atomic T1547.001
    class: 1007
    os: windows
    event:
      process:
        name: reg.exe
        file:
          path: "C:\\Windows\\System32\\reg.exe"
        cmd_line: 'reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Atomic /t REG_SZ /d "C:\evil.exe" /f'

  - name: reg.exe 写 Run 键（实机 ETW 带引号全路径形态）
    technique: T1547.001
    source: 实机回放 2026-08-09
    class: 1007
    os: windows
    event:
      process:
        name: reg.exe
        cmd_line: '"C:\Windows\System32\reg.exe" add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v Atomic /t REG_SZ /d "C:\evil.exe" /f'

  - name: 新服务安装（服务快照 diff 出的新增）
    technique: T1543.001
    source: atomic T1543.001
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\atomic"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\evil.exe; Start=2"

  - name: 已有服务 ImagePath 被篡改
    technique: T1543.001
    source: atomic T1543.001
    class: 201002
    os: windows
    event:
      activity_id: 3
      reg_key:
        path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\WaaSMedicSvc"
      reg_value:
        data: "ImagePath=C:\\Users\\Public\\evil.exe; Start=2"

  - name: IFEO Debugger 劫持（快照 diff 注册表事件）
    technique: T1546.012
    source: atomic T1546.012
    class: 201002
    os: windows
    event:
      activity_id: 1
      reg_key:
        path: "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\notepad.exe\\Debugger"
      reg_value:
        data: "C:\\Users\\Public\\evil.exe"

  - name: WMI 永久事件订阅（CommandLineEventConsumer，伪路径文件事件）
    technique: T1546.003
    source: atomic T1546.003
    class: 1001
    os: windows
    event:
      activity_id: 1
      file:
        path: "wmi:root\\subscription\\__EventConsumer.EvilConsumer"
      wmi:
        data: '{"CommandLineTemplate":"C:\\Users\\Public\\evil.exe","Name":"EvilConsumer"}'
