title: Regsvr32 Remote Scriptlet
id: 89091056-c5c3-5a96-bc85-cc04c881731f
status: experimental
description: |
  检测 regsvr32 /i:http… scrobj.dll 加载远程 scriptlet（Squiblydoo）。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml
author: OpenXDR
tags:
  - attack.defense_evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains|all:
      - 'scrobj.dll'
      - '/i:http'
  condition: selection
level: high
