title: Shell History Tampering
id: 59283b6a-5e10-4c13-9834-e6cb64299287
status: experimental
description: 检测清除或禁用 shell 历史记录——入侵后反取证的常见动作
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - 'history -c'
      - 'unset HISTFILE'
      - 'HISTFILESIZE=0'
      - 'HISTSIZE=0'
      - 'rm ~/.bash_history'
      - 'shred ~/.bash_history'
      - 'ln -sf /dev/null ~/.bash_history'
  condition: selection
level: high
