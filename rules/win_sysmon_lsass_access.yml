title: Sysmon LSASS Memory Access
id: 99b780c7-8ae2-5d8c-aeec-38f17ea2f7c8
status: experimental
description: |
  检测 Sysmon Event 10 里以读内存类权限（0x1010 / 0x40 / 0x1410 / 0x1fffff）打开 lsass.exe。
  排除 Defender、MDE、WMI、任务管理器与系统 svchost 的固定路径；EDR / 备份 / 监控软件仍会命中，
  命中不证明凭据已被导出，所以定 medium。需预装 Sysmon 并开启 collectSysmon（默认关闭）。
author: OpenXDR
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    sysmon.provider: 'Microsoft-Windows-Sysmon'
    sysmon.event_id: 10
    sysmon.target_image|endswith: '\lsass.exe'
    sysmon.source_image|re: '^.+\.exe$'
    sysmon.granted_access|re: '^0x0*(1010|40|1410|1fffff)$'
  filter_known:
    sysmon.source_image:
      - 'C:\Program Files\Windows Defender\MsMpEng.exe'
      - 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MsMpEng.exe'
      - 'C:\Program Files\Windows Defender Advanced Threat Protection\MsSense.exe'
      - 'C:\Program Files\Windows Defender Advanced Threat Protection\SenseIR.exe'
      - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
      - 'C:\Windows\System32\Taskmgr.exe'
      - 'C:\Windows\System32\svchost.exe'
  condition: selection and not filter_known
level: medium
