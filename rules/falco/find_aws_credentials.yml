title: Find AWS Credentials
id: 3b90a5b9-6634-4060-ae16-bb43e6b39dc8
status: experimental
description: |
  移植自 Falco「Find AWS Credentials」（maturity_stable）：用 grep 搜 AWS 密钥字段名，或用 find 找 .aws/credentials。
author: The Falco Authors (ported by OpenXDR)
references:
  - https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml
tags:
  - attack.credential_access
  - attack.t1552
logsource:
  category: process_creation
  product: linux
detection:
  grep:
    Image|endswith:
      - '/grep'
      - '/egrep'
      - '/fgrep'
    CommandLine|contains:
      - 'aws_access_key_id'
      - 'aws_secret_access_key'
      - 'aws_session_token'
      - 'accesskeyid'
      - 'secretaccesskey'
  find:
    Image|endswith: '/find'
    CommandLine|endswith: '.aws/credentials'
  condition: grep or find
level: medium
