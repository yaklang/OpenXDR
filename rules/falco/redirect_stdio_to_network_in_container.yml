title: Redirect STDOUT/STDIN to Network Connection in Container
id: 90576a45-d7d4-4a12-b02a-495c760b99d1
status: experimental
description: |
  移植自 Falco「Redirect STDOUT/STDIN to Network Connection in Container」（maturity_stable）：容器里的进程用 dup 系列调用
  把 TCP 连接接到标准输入输出上，是反弹 shell 与远程命令执行的典型动作。依赖 agent 的 stdio_socket 事件
  （已连接的非回环 TCP 才报，监听套接字与 unix 套接字不报）。
  容器里的 sshd 每接一个连接都会把套接字接到 0/1 上再重新执行自己（生产实测 PVE 的 LXC 容器），按 Falco 留给用户的
  user_known_stand_streams_redirect_activities 的用意排除 sshd 一族。
author: The Falco Authors (ported by OpenXDR)
references:
  - https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml
tags:
  - attack.execution
  - attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  in_container:
    container.runtime:
      - docker
      - podman
      - containerd
      - cri-o
      - lxc
      - nspawn
  stdio:
    stdio_socket.protocol: tcp
  sshd:
    Image|endswith:
      - /sshd
      - /sshd-session
      - /sshd-auth
  condition: in_container and stdio and not sshd
level: low
