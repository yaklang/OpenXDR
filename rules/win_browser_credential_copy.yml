title: Browser Credential Store Copied
id: b387188b-eb84-5838-91e5-b34ec8fcefe7
status: experimental
description: |
  检测命令行复制浏览器凭据库（Chrome/Edge Login Data、Firefox logins.json / key4.db）。
  只覆盖命令行显式复制，进程直接读库看不到。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml
author: OpenXDR
tags:
  - attack.credential_access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\xcopy.exe'
      - '\robocopy.exe'
    CommandLine|re: '\b(copy|copy-item|xcopy|robocopy)\b'
  target:
    CommandLine|contains:
      - '\Login Data'
      - '\logins.json'
      - '\key4.db'
  condition: selection and target
level: high
