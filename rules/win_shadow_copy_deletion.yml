title: Shadow Copy Deletion
id: 2cdb08a1-0247-424f-b2f4-492d10716e0e
status: experimental
description: 检测卷影副本与恢复点删除——勒索软件加密前的标准动作，几乎没有正常运维会这么做
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  vssadmin:
    CommandLine|contains:
      # 不写命令名：真实调用可能是 vssadmin.exe，带上就匹配不到了
      - 'delete shadows'
      - 'resize shadowstorage'
  wmic:
    CommandLine|contains: 'shadowcopy delete'
  bcdedit:
    CommandLine|contains:
      - 'bcdedit /set'
      - 'recoveryenabled no'
  wbadmin:
    CommandLine|contains: 'wbadmin delete'
  condition: vssadmin or wmic or bcdedit or wbadmin
level: critical
