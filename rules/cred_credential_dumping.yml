title: Credential Dumping Attempt
id: ed025ae8-3316-43da-9a3c-1a8f2d885972
status: experimental
description: 检测凭据窃取：LSASS 内存转储（comsvcs MiniDump、procdump）与读取 Linux 影子口令库
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1003.008
# 跨平台：Windows 的 LSASS 转储与 Linux 的影子库读取同属凭据窃取，
# 只限定 category 不限 product
logsource:
  category: process_creation
detection:
  lsass_minidump:
    CommandLine|contains:
      - 'comsvcs.dll'
      - 'MiniDump'
  lsass_target:
    CommandLine|contains: 'lsass'
  procdump:
    CommandLine|contains:
      - 'procdump'
      - '-ma lsass'
  shadow_read:
    CommandLine|contains:
      - 'cat /etc/shadow'
      - 'cp /etc/shadow'
      - 'unshadow'
  condition: (lsass_minidump and lsass_target) or (procdump and lsass_target) or shadow_read
level: critical
