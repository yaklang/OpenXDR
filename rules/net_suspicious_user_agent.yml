title: Suspicious HTTP User-Agent
id: 5a91c0e2-63f7-4b18-9d24-7c8e0b3f1a52
status: experimental
description: 检测常见攻击工具与脚本客户端的 User-Agent，明文 HTTP 下可直接识别
logsource:
  category: network_connection
detection:
  selection:
    http_request.user_agent|contains:
      - 'sqlmap'
      - 'nikto'
      - 'nmap'
      - 'Hydra'
      - 'curl/'
      - 'python-requests'
  condition: selection
level: medium
