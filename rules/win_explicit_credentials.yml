title: Explicit Credential Logon
id: d87ea355-d0bf-4fed-8bb9-9b8a76271ecc
status: experimental
description: 检测显式凭据登录（Security 4648，runas / net use 带口令使用目标账号凭据），
  常见于横向移动。该事件有噪声——计划任务、服务启动同样会触发 4648，
  建议结合事件中的 process_name 与 actor_user 研判，故定级 medium
tags:
  - attack.lateral_movement
  - attack.defense_evasion
  - attack.t1550
  - attack.t1078
logsource:
  category: authentication
  product: windows
detection:
  selection:
    # 平台自定义活动取值：14=显式凭据登录（4648）
    activity_id: 14
  condition: selection
level: medium
