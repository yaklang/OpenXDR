title: Office Spawns Verclsid
id: 012c1af6-bd69-55c6-b2e5-b940f363e903
status: experimental
description: |
  检测 Word / Excel / PowerPoint 拉起 verclsid.exe——恶意文档借 COM 对象校验执行的常见形态。
  要求父子进程路径都可见，父进程缺失不命中。
author: OpenXDR
tags:
  - attack.defense_evasion
  - attack.t1218.012
  - attack.t1559.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\verclsid.exe'
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
  condition: selection
level: high
