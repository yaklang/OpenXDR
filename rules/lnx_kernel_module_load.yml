title: Linux Kernel Module Loaded
id: 826979a8-708d-4cc9-853d-ffee75a4b31b
status: experimental
description: 检测内核模块加载——rootkit 与内核级持久化的落地动作（agent /proc/modules diff 采集）
tags:
  - attack.persistence
  - attack.defense_evasion
  - attack.t1547.006
logsource:
  category: driver_load
  product: linux
detection:
  # 路径解析成功：/lib/modules/<kver>/ 下的 .ko（含压缩形态）
  selection_path:
    ImageLoaded|contains: '.ko'
  # 路径解析失败：事件只带模块名（module.file.name 非空即命中）
  selection_name:
    module.file.name: '*'
  # 发行版内核树里由 docker、iptables/nftables、ss 等按需自动加载的网络与 overlay 模块：
  # 路径在 /lib/modules/<kver>/kernel/ 下且名字在名单里才排除；树外模块（extra/、updates/、/tmp 等）
  # 与只报名字的事件照常告警
  filter_intree_autoload:
    ImageLoaded|re: '^/lib/modules/[^/]+/kernel/(net|drivers/net|fs/overlayfs)/(.+/)?(bridge|br_netfilter|llc|stp|veth|macvlan|ipvlan|vxlan|overlay|udp_tunnel|ip6_udp_tunnel|tls|(inet|tcp|udp|unix|netlink|packet|raw|af_packet)_diag|x_tables|ip_tables|ip6_tables|iptable_[a-z]+|ip6table_[a-z]+|ipt_[A-Za-z]+|ip6t_[A-Za-z]+|xt_[A-Za-z0-9_]+|nf_[a-z0-9_]+|nft_[a-z0-9_]+|nfnetlink[a-z_]*|ip_vs[a-z_]*|xfrm_[a-z_]+)\.ko(\.(xz|zst|gz))?$'
  condition: 1 of selection* and not filter_intree_autoload
level: high
