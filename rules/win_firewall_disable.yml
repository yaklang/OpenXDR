title: Windows Firewall Disabled via Command Line
id: 63759b72-9465-5b5c-8933-ea4d4f439e7a
status: experimental
description: |
  检测 netsh advfirewall set … state off 或 Set-NetFirewallProfile -Enabled False 关闭防火墙。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0602-win-wfirewall_rules.xml
author: OpenXDR
tags:
  - attack.defense_evasion
  - attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  netsh:
    Image|endswith: '\netsh.exe'
    CommandLine|re: '\badvfirewall\s+set\s+(allprofiles|currentprofile|domainprofile|privateprofile|publicprofile)\s+state\s+off\b'
  powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains|all:
      - 'Set-NetFirewallProfile'
      - '-Enabled'
      - 'False'
  condition: netsh or powershell
level: high
