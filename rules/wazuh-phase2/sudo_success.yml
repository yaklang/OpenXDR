{
  "id": "6bc649d0-9f95-54ea-b62c-b70c656765d4",
  "title": "Linux sudo 成功提权审计（关联信号）",
  "status": "experimental",
  "author": "Local security operations",
  "description": "行为或审计信号，不单独证明攻击成功；需结合授权变更核查。",
  "tags": [
    "attack.privilege_escalation",
    "attack.t1548.003"
  ],
  "logsource": {
    "category": "application",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "metadata.product.name": "sudo",
      "message|re": "^\\s*\\S+\\s*:\\s*(?:TTY=\\S+\\s*;\\s*)?PWD=.+\\s;\\sUSER=root\\s;\\s(?:TSID=\\S+\\s;\\s)?COMMAND=\\S.*$"
    },
    "condition": "selection"
  },
  "level": "informational",
  "openxdr_signal": true
}
