{
  "id": "21c25d34-69ac-544c-bda5-43c6765af718",
  "title": "Windows WinRM 端口连接（关联信号）",
  "status": "experimental",
  "author": "Local security operations",
  "description": "行为或审计信号，不单独证明攻击成功；需结合授权变更核查。",
  "tags": [
    "attack.lateral_movement",
    "attack.t1021.006"
  ],
  "logsource": {
    "category": "network_connection",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "DestinationPort": [
        5985,
        5986
      ]
    },
    "tcp_name": {
      "connection_info.protocol_name": "tcp"
    },
    "tcp_number": {
      "connection_info.protocol_num": 6
    },
    "condition": "selection and (tcp_name or tcp_number)"
  },
  "level": "informational",
  "openxdr_signal": true
}
