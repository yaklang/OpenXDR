{
  "id": "9faa9fdd-814a-5412-a494-3e92ca4f26b7",
  "title": "Linux 本地账号创建命令",
  "status": "experimental",
  "author": "Local security operations",
  "description": "行为或审计信号，不单独证明攻击成功；需结合授权变更核查。",
  "tags": [
    "attack.persistence",
    "attack.t1136.001"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "Image|endswith": [
        "/useradd",
        "/adduser"
      ],
      "CommandLine|re": "\\b(?:useradd|adduser)\\s+\\S"
    },
    "filter": {
      "CommandLine|contains": [
        " --help",
        " -h",
        " --version",
        " -D",
        " --defaults"
      ]
    },
    "condition": "selection and not filter"
  },
  "level": "low"
}
