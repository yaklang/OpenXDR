title: Rundll32 Inline Script
id: 90a2177d-b53e-57b7-98a6-72c0f8d48de9
status: experimental
description: |
  检测 rundll32 命令行带 javascript: / vbscript: 执行内嵌脚本。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml
author: OpenXDR
tags:
  - attack.defense_evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
  condition: selection
level: high
