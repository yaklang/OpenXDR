title: Suspicious PowerShell Script Block
id: f9040ab5-3966-4f29-a661-dcb8932042db
status: experimental
description: 检测 PowerShell 脚本块日志（4104 Script Block Logging）中的攻击特征：
  Base64 解码、下载执行、Mimikatz、AMSI 绕过。采集端把脚本块归一化成
  进程事件、脚本体放在 cmd_line，CommandLine 匹配因此直接作用于脚本内容；
  命令行里看不到的内存内脚本（IEX 管道、反射加载）在这条链路上可见
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1027
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  suspicious:
    CommandLine|contains:
      - 'frombase64string'
      - 'downloadstring('
      - 'downloadfile('
      - 'invoke-mimikatz'
      - '-enc '
      - '-encodedcommand'
      - '-ec '
      - 'amsiutils'
      - 'amsiinitfailed'
      - 'amsicontext'
  condition: suspicious
level: high
