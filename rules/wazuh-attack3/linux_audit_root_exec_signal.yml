{
  "id": "d250c39b-b4ac-553c-a0be-b9b634cd1ffd",
  "title": "Linux auditd 普通登录身份以 root 执行程序（关联信号）",
  "status": "experimental",
  "author": "Local security operations",
  "description": "仅覆盖 x86_64 execve/execveat 成功记录，保留 auid/uid/euid/结果；不单独告警，不等同完整 auditd PATH/EXECVE 重组或非 x86 架构。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.privilege_escalation",
    "attack.t1548"
  ],
  "logsource": {
    "category": "application",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "audit.type": "SYSCALL",
      "audit.arch": "c000003e",
      "audit.syscall": [
        "59",
        "322"
      ],
      "audit.success": "yes",
      "audit.euid": "0",
      "audit.auid|re": "^[1-9][0-9]{0,9}$"
    },
    "unset": {
      "audit.auid": "4294967295"
    },
    "condition": "selection and not unset"
  },
  "level": "informational",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ],
  "openxdr_signal": true
}
