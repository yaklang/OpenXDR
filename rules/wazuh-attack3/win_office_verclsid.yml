{
  "id": "012c1af6-bd69-55c6-b2e5-b940f363e903",
  "title": "Windows Office 启动 Verclsid COM 执行程序",
  "status": "experimental",
  "author": "Local security operations",
  "description": "参考 Wazuh 92049/92050；要求父子进程路径均可见。进程名相似或父进程缺失不匹配。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.defense_evasion",
    "attack.t1218.012",
    "attack.t1559.001"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": "\\verclsid.exe",
      "ParentImage|endswith": [
        "\\winword.exe",
        "\\excel.exe",
        "\\powerpnt.exe"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ]
}
