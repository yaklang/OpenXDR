{
  "id": "99b780c7-8ae2-5d8c-aeec-38f17ea2f7c8",
  "title": "Windows Sysmon 检测进程读取 LSASS 内存",
  "status": "experimental",
  "author": "Local security operations",
  "description": "参考 Wazuh 92900；需要 Sysmon Event 10。访问掩码只覆盖列出的已知形态，合法安全软件也可能命中，不按 Program Files 路径一概放行。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.credential_access",
    "attack.t1003.001"
  ],
  "logsource": {
    "category": "process_access",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "sysmon.provider": "Microsoft-Windows-Sysmon",
      "sysmon.event_id": 10,
      "sysmon.target_image|endswith": "\\lsass.exe",
      "sysmon.source_image|re": "(?i)^.+\\.exe$",
      "sysmon.granted_access|re": "(?i)^0x0*(1010|40|1410|1fffff)$"
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ]
}
