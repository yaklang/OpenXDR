{
  "id": "bc96505e-b5fb-53d5-8be1-2837d065d7ed",
  "title": "Linux auditd 审计规则被删除",
  "status": "experimental",
  "author": "Local security operations",
  "description": "使用 auditd 转发的结构化 CONFIG_CHANGE 记录；必须配置日志转发。不等同完整 auditd 多记录重组。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.defense_evasion",
    "attack.t1562.001"
  ],
  "logsource": {
    "category": "application",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "audit.type": "CONFIG_CHANGE",
      "audit.op": "remove_rule",
      "audit.res": [
        "1",
        "success"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ]
}
