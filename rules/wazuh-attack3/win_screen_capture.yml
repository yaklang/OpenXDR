{
  "id": "d44d370e-d126-5fc4-b011-b7a2e4c76dc1",
  "title": "Windows PowerShell 调用屏幕捕获方法",
  "status": "experimental",
  "author": "Local security operations",
  "description": "参考 Wazuh 91803；使用已有 PowerShell 4104 或进程命令行。脚本引用与执行结果需进一步核实。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.collection",
    "attack.t1113"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "method": {
      "CommandLine|re": "(?i)\\bCopyFromScreen\\s*\\("
    },
    "name": {
      "process.name": [
        "powershell.exe",
        "pwsh.exe"
      ]
    },
    "image": {
      "Image|endswith": [
        "\\powershell.exe",
        "\\pwsh.exe"
      ]
    },
    "condition": "method and (name or image)"
  },
  "level": "medium",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ]
}
