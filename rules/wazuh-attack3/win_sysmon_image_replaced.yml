{
  "id": "2fa13aee-05ec-529d-96b7-a2ebcab604cb",
  "title": "Windows Sysmon 检测进程映像被替换",
  "status": "experimental",
  "author": "Local security operations",
  "description": "需要支持 Event 25 的 Sysmon 和新版 Agent；仅处理明确的 Image is replaced 事件，不把一般远程线程称为进程镂空。 命中代表需核查的行为，不单独证明入侵，不自动执行处置。",
  "tags": [
    "attack.defense_evasion",
    "attack.t1055.012"
  ],
  "logsource": {
    "category": "process_tampering",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "sysmon.provider": "Microsoft-Windows-Sysmon",
      "sysmon.event_id": 25,
      "sysmon.tamper_type": "Image is replaced",
      "sysmon.image|re": "(?i)^.+\\.exe$"
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "经授权的管理、调试、自动化或安全测试；结合账号、签名、来源及变更窗口复核。"
  ]
}
