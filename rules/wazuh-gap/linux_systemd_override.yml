{
  "title": "Linux systemd 服务覆盖配置发生变更",
  "id": "abd29952-cb54-59cf-9fce-55cd1d5abca2",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0285-systemd_rules.xml"
  ],
  "tags": [
    "attack.persistence",
    "attack.t1543.002"
  ],
  "logsource": {
    "category": "file_event",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "activity_id": [
        1,
        3,
        4
      ],
      "TargetFilename|re": "^/etc/systemd/(system|user)/[^/]+\\.service\\.d/[^/]+\\.conf$"
    },
    "condition": "selection"
  },
  "level": "low",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
