{
  "title": "Windows 注册表 SAM 凭据库导出",
  "id": "5e2ad579-2d87-57b9-936e-3883c233b6ac",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.credential_access",
    "attack.t1003.002"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": "\\reg.exe",
      "CommandLine|re": "(?i)\\bsave\\s+[\"\\x27]?(hklm|hkey_local_machine)\\\\sam([\"\\x27\\s]|$)"
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
