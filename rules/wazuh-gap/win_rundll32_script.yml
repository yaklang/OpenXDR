{
  "title": "Windows Rundll32 执行内嵌脚本",
  "id": "90a2177d-b53e-57b7-98a6-72c0f8d48de9",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.defense_evasion",
    "attack.t1218.011"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": "\\rundll32.exe",
      "CommandLine|contains": [
        "javascript:",
        "vbscript:"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
