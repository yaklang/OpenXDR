{
  "title": "Linux 组与权限数据库发生变更",
  "id": "b11dcf5c-024d-5327-9b85-0cd31eec139e",
  "status": "experimental",
  "author": "Local security operations",
  "description": "group/gshadow 变化是账号权限操纵 T1098 的候选信号，授权账号管理也会触发，必须核对变更内容，不能据此确证攻击。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0015-ossec_rules.xml"
  ],
  "tags": [
    "attack.persistence",
    "attack.t1098"
  ],
  "logsource": {
    "category": "file_event",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "activity_id": [
        1,
        3,
        4
      ],
      "TargetFilename": [
        "/etc/group",
        "/etc/gshadow"
      ]
    },
    "condition": "selection"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
