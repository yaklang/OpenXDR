{
  "title": "Windows Regsvr32 加载远程脚本",
  "id": "89091056-c5c3-5a96-bc85-cc04c881731f",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.defense_evasion",
    "attack.t1218.010"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": "\\regsvr32.exe",
      "CommandLine|contains|all": [
        "scrobj.dll",
        "/i:http"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
