{
  "title": "MySQL 认证失败（关联信号）",
  "id": "f60746a0-0eff-5cee-b0f1-446474d747fa",
  "status": "experimental",
  "author": "Local security operations",
  "description": "依赖数据库日志转发；同资产计数不保证来自同一源地址。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0295-mysql_rules.xml"
  ],
  "tags": [
    "attack.credential_access",
    "attack.t1110.001"
  ],
  "logsource": {
    "category": "application"
  },
  "detection": {
    "selection": {
      "metadata.product.name": [
        "mysql",
        "mysqld",
        "mariadbd"
      ],
      "message|contains|all": [
        "Access denied for user",
        "using password:"
      ]
    },
    "condition": "selection"
  },
  "level": "informational",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ],
  "openxdr_signal": true
}
