{
  "title": "Windows 显式 Pass-the-Hash 工具命令",
  "id": "7ab14c60-bb25-5bb1-b881-b7e7a9b09d80",
  "status": "experimental",
  "author": "Local security operations",
  "description": "仅显式工具命令形态；当前 Agent 不保留 AuthenticationPackageName 等字段，不能替代基于 NTLM 日志的 Pass-the-Hash 研判。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0840-win_event_channel.xml"
  ],
  "tags": [
    "attack.lateral_movement",
    "attack.t1550.002"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "CommandLine|contains|all": [
        "sekurlsa::pth",
        "/ntlm:"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
