{
  "title": "Windows 脚本宿主从下载或临时目录执行脚本",
  "id": "d212fecb-638d-59b7-99a5-657168346c91",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.execution",
    "attack.t1059.005",
    "attack.t1059.007"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": [
        "\\wscript.exe",
        "\\cscript.exe"
      ],
      "CommandLine|re": "(?i)\\\\(downloads|temp)\\\\[^\\r\\n]*\\.(vbs|js|jse|vbe)([\"\\s]|$)"
    },
    "condition": "selection"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
