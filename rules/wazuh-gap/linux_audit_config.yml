{
  "title": "Linux audit 审计配置发生变更",
  "id": "3d45853c-0077-519e-ba73-bf306e11b067",
  "status": "experimental",
  "author": "Local security operations",
  "description": "配置变化需核查，无法从文件事件直接判断是否关闭审计。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0365-auditd_rules.xml"
  ],
  "tags": [
    "attack.defense_evasion",
    "attack.t1562.001"
  ],
  "logsource": {
    "category": "file_event",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "activity_id": [
        1,
        3,
        4
      ],
      "TargetFilename|re": "^/etc/audit/(auditd\\.conf|audit\\.rules|rules\\.d/[^/]+\\.rules)$"
    },
    "condition": "selection"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
