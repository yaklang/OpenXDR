{
  "title": "Windows 向远程管理共享复制文件",
  "id": "5aac7f39-69e3-524a-8b90-80defe987530",
  "status": "experimental",
  "author": "Local security operations",
  "description": "软件分发也会出现；需结合账号、后续执行与变更授权。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.lateral_movement",
    "attack.t1570",
    "attack.t1021.002"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "Image|endswith": [
        "\\cmd.exe",
        "\\powershell.exe",
        "\\pwsh.exe",
        "\\xcopy.exe",
        "\\robocopy.exe"
      ],
      "CommandLine|re": "(?i)\\b(copy|copy-item|xcopy|robocopy)\\b"
    },
    "share": {
      "CommandLine|re": "\\\\\\\\[^\\\\\\s]+\\\\(admin\\$|[a-z]\\$)\\\\"
    },
    "condition": "selection and share"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
