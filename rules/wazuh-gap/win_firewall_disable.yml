{
  "title": "Windows 命令行禁用防火墙",
  "id": "63759b72-9465-5b5c-8933-ea4d4f439e7a",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0602-win-wfirewall_rules.xml"
  ],
  "tags": [
    "attack.defense_evasion",
    "attack.t1562.004"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "netsh": {
      "Image|endswith": "\\netsh.exe",
      "CommandLine|re": "(?i)\\badvfirewall\\s+set\\s+(allprofiles|currentprofile|domainprofile|privateprofile|publicprofile)\\s+state\\s+off\\b"
    },
    "powershell": {
      "Image|endswith": [
        "\\powershell.exe",
        "\\pwsh.exe"
      ],
      "CommandLine|contains|all": [
        "Set-NetFirewallProfile",
        "-Enabled",
        "False"
      ]
    },
    "condition": "netsh or powershell"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
