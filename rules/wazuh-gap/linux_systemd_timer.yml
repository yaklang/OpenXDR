{
  "title": "Linux systemd 定时器发生变更",
  "id": "d6c15ecc-b615-5f84-8675-86eaeac861f9",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0015-ossec_rules.xml"
  ],
  "tags": [
    "attack.persistence",
    "attack.t1053.006"
  ],
  "logsource": {
    "category": "file_event",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "activity_id": [
        1,
        3,
        4
      ],
      "TargetFilename|re": "^/etc/systemd/(system|user)/.+\\.timer$"
    },
    "condition": "selection"
  },
  "level": "low",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
