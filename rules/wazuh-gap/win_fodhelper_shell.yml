{
  "title": "Windows Fodhelper 异常拉起命令解释器",
  "id": "ea83644a-dd62-5fe5-acd3-dd6ea3661a74",
  "status": "experimental",
  "author": "Local security operations",
  "description": "需采集到父进程路径；字段缺失时不命中。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0800-sysmon_id_1.xml"
  ],
  "tags": [
    "attack.privilege_escalation",
    "attack.t1548.002"
  ],
  "logsource": {
    "category": "process_creation",
    "product": "windows"
  },
  "detection": {
    "selection": {
      "ParentImage|endswith": "\\fodhelper.exe",
      "Image|endswith": [
        "\\cmd.exe",
        "\\powershell.exe",
        "\\pwsh.exe"
      ]
    },
    "condition": "selection"
  },
  "level": "high",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
