{
  "title": "Linux 启动脚本发生变更",
  "id": "baf3aa4d-4b55-51e0-9044-568e259d4d56",
  "status": "experimental",
  "author": "Local security operations",
  "description": " 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0015-ossec_rules.xml"
  ],
  "tags": [
    "attack.persistence",
    "attack.t1037.004"
  ],
  "logsource": {
    "category": "file_event",
    "product": "linux"
  },
  "detection": {
    "selection": {
      "activity_id": [
        1,
        3,
        4
      ],
      "TargetFilename|re": "^/etc/(rc\\.local$|rc\\.d/|init\\.d/|rc[0-6S]\\.d/)"
    },
    "condition": "selection"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
