{
  "title": "Web 日志中的敏感文件路径穿越请求",
  "id": "aa7b9029-6e1a-5312-b502-022e0171870d",
  "status": "experimental",
  "author": "Local security operations",
  "description": "仅可疑请求信号，不表示漏洞利用成功；需将 Web 日志带应用标签转发到 syslog。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0245-web_rules.xml"
  ],
  "tags": [
    "attack.initial_access",
    "attack.t1190"
  ],
  "logsource": {
    "category": "application"
  },
  "detection": {
    "selection": {
      "metadata.product.name": [
        "nginx",
        "apache",
        "apache2",
        "httpd"
      ],
      "message|re": "(?i)(\\.\\./|%2e%2e(?:%2f|/)|\\.%2e/|%2e\\./)"
    },
    "target": {
      "message|contains": [
        "etc/passwd",
        "etc%2fpasswd",
        "win.ini",
        "boot.ini"
      ]
    },
    "condition": "selection and target"
  },
  "level": "medium",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ]
}
