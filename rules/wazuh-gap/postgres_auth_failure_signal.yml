{
  "title": "PostgreSQL 认证失败（关联信号）",
  "id": "2291148d-3b73-5896-911d-9e37bcbf1fb5",
  "status": "experimental",
  "author": "Local security operations",
  "description": "依赖 PostgreSQL 日志通过 syslog 接入；不是访问监控平台自用数据库。 参照 Wazuh 的检测场景独立编写；表示需核查的行为，不单独证明入侵。",
  "references": [
    "https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0300-postgresql_rules.xml"
  ],
  "tags": [
    "attack.credential_access",
    "attack.t1110.001"
  ],
  "logsource": {
    "category": "application"
  },
  "detection": {
    "selection": {
      "metadata.product.name": [
        "postgres",
        "postgresql"
      ],
      "message|contains": "password authentication failed for user"
    },
    "condition": "selection"
  },
  "level": "informational",
  "falsepositives": [
    "授权运维、软件部署或安全测试；结合变更窗口和操作者核查，不自动隔离。"
  ],
  "openxdr_signal": true
}
