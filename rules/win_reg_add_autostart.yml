title: Autostart Registry Write via Command Line
id: e54614db-ddf3-4d3d-bc01-c5506170b90a
status: experimental
description: |
  检测用 reg.exe / PowerShell 写自启动键。与注册表快照 diff 互补：
  这一路是进程视角，即时且带下手的进程与用户上下文。
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  writer:
    CommandLine|contains:
      - 'reg add'
      - 'reg.exe add'
      - 'New-ItemProperty'
      - 'Set-ItemProperty'
  autostart_key:
    CommandLine|contains:
      - 'CurrentVersion\Run'
      - 'CurrentVersion\RunOnce'
      - '\Winlogon'
  condition: writer and autostart_key
level: high
