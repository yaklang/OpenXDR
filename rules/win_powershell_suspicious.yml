title: Suspicious PowerShell Invocation
id: 98f947bf-49b0-4dad-aec8-02b07f41ed9a
status: experimental
description: 检测编码执行、隐藏窗口与内存加载等 PowerShell 攻击特征
logsource:
  category: process_creation
  product: windows
detection:
  powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  suspicious:
    CommandLine|contains:
      - '-enc '
      - '-encodedcommand'
      - '-w hidden'
      - '-windowstyle hidden'
      - 'downloadstring('
      - 'iex('
      - 'invoke-expression'
      - 'frombase64string'
  condition: powershell and suspicious
level: high
