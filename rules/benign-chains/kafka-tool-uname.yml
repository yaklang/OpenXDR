id: kafka-tool-uname
title: Kafka 工具脚本环境探测（kafka-run-class.sh → uname -a）
description: >-
  Apache Kafka 官方脚本（kafka-topics.sh、ConsumerGroupCommand 等统一经 kafka-run-class.sh 启动）
  在组装类路径与 JVM 参数前固定执行 uname -a 检测操作系统与 WSL 环境，触发 Linux 侦察命令规则。
  要求当前可执行文件为系统 uname 且仅带 -a 参数，父进程为系统 bash/sh 且首参直接指向 Kafka bin 目录下的
  kafka-*.sh 脚本（拒绝 bash -c 与注释伪造）。
sample: >-
  /bin/bash /opt/kafka/bin/kafka-run-class.sh kafka.admin.ConsumerGroupCommand --bootstrap-server 127.0.0.1:9092 --list →
  /bin/uname -a
rules:
  - "*"
conditions:
  - field: process.file.path
    op: in
    values:
      - /bin/uname
      - /usr/bin/uname
  - field: process.cmd_line
    op: regex
    value: '^((/usr)?/bin/)?uname\s+-a$'
  - field: process.parent_process.file.path
    op: in
    values:
      - /bin/bash
      - /usr/bin/bash
      - /bin/sh
      - /usr/bin/sh
  - field: process.parent_process.cmd_line
    op: regex
    value: '^(/usr)?/bin/(ba)?sh\s+/\S*/kafka[^/\s]*/bin/kafka-[a-z0-9-]+\.sh(\s|$)'
