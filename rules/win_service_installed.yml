title: Windows Service Installed or Tampered
id: 8c4e2a7b-3f9d-4b6e-a1c8-5e7d9f2b4a63
status: experimental
description: |
  检测 Windows 服务快照 diff 出的新增服务与服务配置变更（ImagePath /
  启动类型）。系统里服务本来就多，重点信号是"新增"（activity_id=1）；
  变更（activity_id=3）里混着启动类型翻转的正常运维，统一定 medium，
  由研判结合同主机其他告警定性。与 sc.exe / New-Service 的进程视角互补：
  这一路连直接写注册表的服务安装也能看见。
tags:
  - attack.persistence
  - attack.t1543.001
logsource:
  category: registry_set
  product: windows
detection:
  services:
    TargetObject|startswith: 'HKLM\SYSTEM\CurrentControlSet\Services\'
  install_or_tamper:
    activity_id:
      - 1
      - 3
  condition: services and install_or_tamper
level: medium
