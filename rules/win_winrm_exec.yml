title: PowerShell Remoting Execution
id: 80ea6f71-2a4d-5651-9803-3a1edd582414
status: experimental
description: |
  检测 PowerShell 用 Invoke-Command / Enter-PSSession / New-PSSession 带 -ComputerName / -Session 远程执行。
  授权远程管理同样会命中。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0915-win-powershell_rules.xml
author: OpenXDR
tags:
  - attack.lateral_movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  command:
    CommandLine|re: '\b(invoke-command|enter-pssession|new-pssession)\b'
  remote:
    CommandLine|re: '-(computername|session)\b'
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection and command and remote
level: medium
