title: Linux Audit Config Changed (时序信号)
id: 3d45853c-0077-519e-ba73-bf306e11b067
status: experimental
description: |
  时序信号，不单独告警：auditd 配置（auditd.conf、audit.rules、rules.d/*.rules）新建、修改或删除。
  agent 递归监控 /etc，装包、augenrules 与配置管理会频繁命中；文件事件看不出审计是否被关闭，只供时序规则关联。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0365-auditd_rules.xml
author: OpenXDR
openxdr_signal: true
tags:
  - attack.defense_evasion
  - attack.t1562.012
logsource:
  category: file_event
  product: linux
detection:
  selection:
    activity_id:
      - 1
      - 3
      - 4
    TargetFilename|re: '^/etc/audit/(auditd\.conf|audit\.rules|rules\.d/[^/]+\.rules)$'
  condition: selection
level: informational
