title: Windows Logon Success (时序信号)
id: a2ebc770-fe00-5d87-b5b4-cb97cd9ab2cf
status: experimental
description: |
  时序信号，不单独告警：Windows 登录成功（RDP 类型 10 除外）。
  供 temporal:wazuh-gap-windows-fail-success 关联；RDP 成功只走 windows-fail-rdp，同一次登录不同时命中两条链路。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0580-win-security_rules.xml
author: OpenXDR
openxdr_signal: true
tags:
  - attack.initial_access
  - attack.t1078
logsource:
  category: authentication
  product: windows
detection:
  selection:
    activity_id: 1
    status_id: 1
  rdp:
    service.name: 'logon-type-10'
  condition: selection and not rdp
level: informational
