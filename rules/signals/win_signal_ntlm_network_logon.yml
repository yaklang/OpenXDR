title: Windows NTLM Network Logon (时序信号)
id: a1f52dd2-fc4a-587f-84f7-34bafe28712c
status: experimental
description: |
  时序信号，不单独告警：Security 4624 类型 3、认证包 NTLM、登录进程 NtLmSsp 且带来源地址。
  域内正常访问共享、打印同样走 NTLM，单凭它不能认定 Pass-the-Hash，所以不标 T1550.002，只供时序规则关联。
  需要新版 agent 采集认证包与登录进程字段。
author: OpenXDR
openxdr_signal: true
tags:
  - attack.initial_access
  - attack.t1078
logsource:
  category: authentication
  product: windows
detection:
  selection:
    event_id: 4624
    log_name: 'Security'
    status_id: 1
    service.name: 'logon-type-3'
    authentication_package: 'NTLM'
    logon_process: 'NtLmSsp'
    src_endpoint.ip|re: '^[0-9a-fA-F:.]+$'
    user.name|re: '^.+$'
  condition: selection
level: informational
