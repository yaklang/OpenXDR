title: Linux Group Database Changed (时序信号)
id: b11dcf5c-024d-5327-9b85-0cd31eec139e
status: experimental
description: |
  时序信号，不单独告警：/etc/group、/etc/gshadow 新建、修改或删除。
  useradd、groupadd、装包建系统组都会改这两个文件，单独看全是运维噪声；看不出改了什么，只供时序规则关联。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0015-ossec_rules.xml
author: OpenXDR
openxdr_signal: true
tags:
  - attack.persistence
  - attack.t1098
logsource:
  category: file_event
  product: linux
detection:
  selection:
    activity_id:
      - 1
      - 3
      - 4
    TargetFilename:
      - '/etc/group'
      - '/etc/gshadow'
  condition: selection
level: informational
