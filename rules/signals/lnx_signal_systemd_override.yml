title: Linux Systemd Drop-in Override Changed (时序信号)
id: abd29952-cb54-59cf-9fce-55cd1d5abca2
status: experimental
description: |
  时序信号，不单独告警：/etc/systemd/{system,user}/*.service.d/*.conf 覆盖配置变更。
  systemctl edit、装包与配置管理都会写 drop-in，只供时序规则关联。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0285-systemd_rules.xml
author: OpenXDR
openxdr_signal: true
tags:
  - attack.persistence
  - attack.t1543.002
logsource:
  category: file_event
  product: linux
detection:
  selection:
    activity_id:
      - 1
      - 3
      - 4
    TargetFilename|re: '^/etc/systemd/(system|user)/[^/]+\.service\.d/[^/]+\.conf$'
  condition: selection
level: informational
