title: Linux Systemd Timer Changed (时序信号)
id: d6c15ecc-b615-5f84-8675-86eaeac861f9
status: experimental
description: |
  时序信号，不单独告警：/etc/systemd/{system,user} 下 .timer 单元变更。
  含 *.wants/ 下 systemctl enable 建的符号链接，装包启用定时器也会命中，只供时序规则关联。
references:
  - https://github.com/wazuh/wazuh/blob/v4.14.9/ruleset/rules/0015-ossec_rules.xml
author: OpenXDR
openxdr_signal: true
tags:
  - attack.persistence
  - attack.t1053.006
logsource:
  category: file_event
  product: linux
detection:
  selection:
    activity_id:
      - 1
      - 3
      - 4
    TargetFilename|re: '^/etc/systemd/(system|user)/.+\.timer$'
  condition: selection
level: informational
