title: Linux Systemd Service Unit Deleted (时序信号)
id: 89454b35-df30-510a-9530-a5226a8c82ac
status: experimental
description: |
  时序信号，不单独告警：systemd .service 单元文件被删除，可能是清理持久化痕迹（T1070）。
  排除 .wants/、.requires/ 下 systemctl disable 删的符号链接；编辑器与 dpkg 的备份、临时文件（~、.swp、.dpkg-*）
  不以 .service 结尾，本就不命中。但 agent 把「移出」记作删除，编辑器先把原文件改名成备份再写新文件时，
  原路径也会报一次删除；卸载软件同样删单元文件，所以只供时序规则关联。agent 默认只监控 /etc/systemd/system，
  /usr/lib/systemd/system 与 /lib/systemd/system 需在采集配置 fileWatchDirs 里显式加上才可见。
author: OpenXDR
openxdr_signal: true
tags:
  - attack.defense_evasion
  - attack.t1070
logsource:
  category: file_event
  product: linux
detection:
  selection:
    activity_id: 4
    TargetFilename|startswith:
      - '/etc/systemd/system/'
      - '/usr/lib/systemd/system/'
      - '/lib/systemd/system/'
    TargetFilename|endswith: '.service'
  filter_links:
    TargetFilename|contains:
      - '.wants/'
      - '.requires/'
  condition: selection and not filter_links
level: informational
