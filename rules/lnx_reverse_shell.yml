title: Linux Reverse Shell Indicators
id: 6742a2ee-b09c-4eb9-a040-1be583da8332
status: experimental
description: |
  检测反弹 shell：shell 的标准输入输出接到 /dev/tcp 套接字、交互式 shell 反连、nc -e。
  单纯 "echo > /dev/tcp/主机/端口" 只是端口探测，不接 shell 输入输出，由 lnx_devtcp_port_probe 低危单列——
  运维连通性脚本常用这一写法，混在这里会把宿主机巡检刷成严重告警。
tags:
  - attack.execution
  - attack.command_and_control
  - attack.t1059.004
  - attack.t1059.006
  - attack.t1571
logsource:
  category: process_creation
  product: linux
detection:
  # 套接字接到 shell 的输入输出：>& / &> /dev/tcp、0< /dev/tcp（stdin 来自套接字）、
  # > /dev/tcp/… 0<&1（stdin 跟随），或 <> 双向打开后把 shell 接到 3 号及以上 fd：stderr 写回套接字（2>&5），
  # 或 sh / bash / eval 的输入输出重定向到它（sh <&196、eval "$c" >&3）。
  # 只读的 banner 抓取（exec 3<> … head <&3）、往套接字写一个 HTTP 请求再读回（printf … >&3; head <&3）与无关的 2>&1 都不算
  devsock_shell_io:
    CommandLine|re: '(>&|&>|0<)\s*/dev/(tcp|udp)/|/dev/(tcp|udp)/\S+\s+0[<>]&1|<>\s*/dev/(tcp|udp)/.*(\b2>&([3-9]|[1-9][0-9]+)|\b((ba|z|k|da)?sh|eval)\b[^;|&]*[<>]&([3-9]|[1-9][0-9]+))'
  explicit:
    CommandLine|contains:
      - 'bash -i >&'
      - 'sh -i >&'
      - 'nc -e /bin/'
      - 'ncat -e /bin/'
  py_revshell:
    CommandLine|contains: 'socket.SOCK_STREAM'
  py_revshell_exec:
    CommandLine|contains:
      - 'subprocess'
      - 'pty.spawn'
      - 'os.dup2'
      - 'os.popen'
      - 'os.system'
      - '/bin/sh'
      - '/bin/bash'
  condition: devsock_shell_io or explicit or (py_revshell and py_revshell_exec)
level: critical
